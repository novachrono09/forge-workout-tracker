  function buildSessionFromHistory(w) {
    const wo = {
      id: uid(),
      date: todayISO(),
      name: w.name || "Session",
      status: "active",
      started: Date.now(),
      ended: null,
      duration: 0,
      feel: 5, energy: 5, soreness: 3, sleep: 7, note: `Repeated from ${w.date}`,
      exercises: w.exercises.map(e => ({
        id: uid(),
        exerciseId: e.exerciseId,
        targetSets: e.targetSets || e.sets.length,
        targetReps: e.targetReps || "8-10",
        rest: e.rest || 90,
        note: e.note || "",
        sets: e.sets.map(s => ({
          id: uid(),
          type: s.type || "working",
          w: s.w || 0,
          r: s.r || 0,
          rpe: s.rpe || null,
          done: false
        }))
      }))
    };
    S.active = wo;
    save();
    go("workout");
    haptic(HAPTIC.SUCCESS);
    toast(`Live session started from ${fmtDate(w.date)}!`);
  }

  function shareWorkoutSummary(woId) {
    const w = S.workouts.find(x => x.id === woId);
    if (!w) return;
    const setTotal = workingSets(w);
    const vol = trimNum(toDisplay(volumeOf(w))) + " " + u();
    const dur = Math.round((w.duration || 0) / 60) + "m";
    const exList = w.exercises.map(e => `• ${getEx(e.exerciseId).name}: ${e.sets.filter(s=>s.done).length} sets`).join("\n");

    const text = `🏋️ FORGE SESSION SUMMARY\n${w.name} (${fmtDate(w.date)})\n⏱️ ${dur} · 📊 ${setTotal} sets · 🏋️ ${vol} vol\n\n${exList}\n\nForged with FORGE Workout Tracker`;

    try {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text);
        toast("Workout summary copied to clipboard! 📋");
      } else {
        toast("Summary generated!");
      }
    } catch (_) {
      toast("Summary generated!");
    }
  }

  // Multi-select history mode
  let selectedWorkouts = new Set();

  function ensureHistoryCheckboxes() {
    document.querySelectorAll("[data-open-wo], .hist-row").forEach(row => {
      if (!row.querySelector(".hist-checkbox")) {
        const cb = document.createElement("div");
        cb.className = "hist-checkbox";
        cb.textContent = "✓";
        row.insertBefore(cb, row.firstChild);
      }
    });
  }

  function enterHistoryMultiMode(initialId) {
    selectedWorkouts.clear();
    ensureHistoryCheckboxes();
    document.body.classList.add("history-multi-mode");
    if (initialId) toggleHistorySelection(initialId);
    else renderHistoryMultiBar();
  }

  function exitHistoryMultiMode() {
    selectedWorkouts.clear();
    document.body.classList.remove("history-multi-mode");
    document.querySelectorAll(".hist-row.selected, [data-open-wo].selected").forEach(r => r.classList.remove("selected"));
    const bar = document.getElementById("historyMultiBar");
    if (bar) bar.classList.remove("open");
  }

  function toggleHistorySelection(woId, targetEl) {
    if (selectedWorkouts.has(woId)) {
      selectedWorkouts.delete(woId);
    } else {
      selectedWorkouts.add(woId);
    }

    const row = targetEl || document.querySelector(`[data-open-wo="${woId}"], .hist-row[data-open-wo="${woId}"]`);
    if (row) {
      row.classList.toggle("selected", selectedWorkouts.has(woId));
    }

    if (selectedWorkouts.size === 0) {
      exitHistoryMultiMode();
    } else {
      renderHistoryMultiBar();
    }
  }

  function renderHistoryMultiBar() {
    let bar = document.getElementById("historyMultiBar");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "historyMultiBar";
      bar.className = "forge-multiselect-bar";
      document.body.appendChild(bar);
    }

    const count = selectedWorkouts.size;
    bar.innerHTML = `
      <span style="font-size:13px;font-weight:800;color:var(--accent);font-family:monospace">${count} SELECTED</span>
      <button class="btn sm" id="btnExportSelected">Export JSON</button>
      <button class="btn sm danger" id="btnDeleteSelected">Delete (${count})</button>
      <button class="btn sm ghost" id="btnCancelMulti">Done</button>
    `;

    bar.classList.add("open");

    bar.querySelector("#btnCancelMulti").onclick = exitHistoryMultiMode;
    bar.querySelector("#btnExportSelected").onclick = () => {
      const list = S.workouts.filter(w => selectedWorkouts.has(w.id));
      const jsonStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(list, null, 2));
      const a = document.createElement("a");
      a.href = jsonStr;
      a.download = `forge-workouts-export-${todayISO()}.json`;
      a.click();
      toast(`Exported ${count} workout(s)`);
    };
    const delBtn = bar.querySelector("#btnDeleteSelected");
    if (delBtn) {
      attachHoldConfirm(delBtn, {
        duration: GESTURE.HOLD_CONFIRM_MS,
        labelDefault: `Delete (${count})`,
        labelHolding: "Hold to delete…",
        onConfirm: () => {
          S.workouts = S.workouts.filter(w => !selectedWorkouts.has(w.id));
          save();
          exitHistoryMultiMode();
          render();
          toast(`Deleted ${count} workout log(s)`);
        }
      });
    }
  }

  function bindAllLongPress(c) {
    if (!c) return;

    // 1. Set Rows in Active Workout
    c.querySelectorAll(".set-card-row").forEach(row => {
      const checkBtn = row.querySelector(".check");
      if (!checkBtn) return;
      const toggleSetVal = checkBtn.dataset.toggleSet;
      if (!toggleSetVal) return;
      const [bid, sid] = toggleSetVal.split(":");

      attachLongPress(row, {
        threshold: GESTURE.LONG_PRESS_MS,
        onActivate: (el, pt) => {
          showSetRowPopover(bid, sid, el, pt);
        }
      });
    });

    // 2. Ghost performance tags in Set Rows
    c.querySelectorAll(".set-prev-tag").forEach(tag => {
      const row = tag.closest(".set-card-row");
      const checkBtn = row?.querySelector(".check");
      if (!checkBtn) return;
      const [bid, sid] = checkBtn.dataset.toggleSet.split(":");

      attachLongPress(tag, {
        threshold: GESTURE.LONG_PRESS_MS,
        onActivate: (el, pt) => {
          showGhostTagPopover(bid, sid, el, pt);
        }
      });
    });

    // 3. Exercise Card Headers in Active Workout
    c.querySelectorAll(".ex-card-h").forEach(hdr => {
      const card = hdr.closest(".ex-card");
      const bid = card?.dataset.excard || hdr.dataset.toggleEx;
      if (!bid) return;

      attachLongPress(hdr, {
        threshold: GESTURE.LONG_PRESS_MS,
        onActivate: () => {
          showExCardSheet(bid);
        }
      });
    });

    // 4. Routine Day Cards / Rows
    c.querySelectorAll("[data-start-day], .card[data-day-name]").forEach(card => {
      const dayIdx = card.dataset.startDay ?? card.querySelector("[data-day-name]")?.dataset.dayName;
      if (dayIdx == null) return;

      attachLongPress(card, {
        threshold: GESTURE.LONG_PRESS_MS,
        onActivate: () => {
          showRoutineDaySheet(+dayIdx);
        }
      });
    });

    // 5. History Workout Cards / Rows
    c.querySelectorAll("[data-open-wo], .hist-row").forEach(row => {
      const woId = row.dataset.openWo;
      if (!woId) return;

      if (selectedWorkouts.has(woId)) row.classList.add("selected");
      else row.classList.remove("selected");

      if (!row.querySelector(".hist-checkbox")) {
        const cb = document.createElement("div");
        cb.className = "hist-checkbox";
        cb.textContent = "✓";
        row.insertBefore(cb, row.firstChild);
      }

      attachLongPress(row, {
        threshold: GESTURE.LONG_PRESS_MS,
        onActivate: () => {
          if (document.body.classList.contains("history-multi-mode")) {
            toggleHistorySelection(woId);
          } else {
            showHistoryWorkoutSheet(woId, row);
          }
        }
      });
    });

    // 6. Exercise Library Rows
    c.querySelectorAll(".lib-row[data-go-ex]").forEach(row => {
      const exId = row.dataset.goEx;
      if (!exId) return;

      attachLongPress(row, {
        threshold: GESTURE.LONG_PRESS_MS,
        onActivate: () => {
          showExerciseLibrarySheet(exId);
        }

  /* ---------- Pull-to-Refresh Engine ---------- */
  (function setupPullToRefresh() {
    let startY = 0;
    let startX = 0;
    let isPulling = false;
    let armed = false;
    let refreshing = false;
    let activeContainer = null;

    const SUPPORTED_VIEWS = new Set(['history', 'progress']);

    function getBanner(c) {
      return c ? c.querySelector('#ptrBanner') : null;
    }

    function onTouchStart(e) {
      if (refreshing || navLock) return;
      const currentView = window.currentActiveView || view;
      if (!SUPPORTED_VIEWS.has(currentView)) return;

      const container = e.currentTarget;
      if (!container || container.scrollTop > 1) return;

      const t = e.touches ? e.touches[0] : e;
      startY = t.clientY;
      startX = t.clientX;
      isPulling = false;
      armed = false;
      activeContainer = container;
    }

    function onTouchMove(e) {
      if (refreshing || !activeContainer) return;
      const banner = getBanner(activeContainer);
      if (!banner) return;

      if (activeContainer.scrollTop > 1 && !isPulling) return;

      const t = e.touches ? e.touches[0] : e;
      const dy = t.clientY - startY;
      const dx = t.clientX - startX;

      if (!isPulling) {
        if (dy > 8 && dy > Math.abs(dx) && activeContainer.scrollTop <= 1) {
          isPulling = true;
          banner.classList.add('dragging');
          banner.classList.remove('releasing');
        } else {
          return;
        }
      }

      if (isPulling) {
        if (e.cancelable) e.preventDefault();

        const pullDist = Math.min(85, Math.pow(Math.max(0, dy), 0.82) * 1.8);
        const iconWrap = banner.querySelector('.ptr-icon-wrap');
        const textEl = banner.querySelector('.ptr-text');

        banner.style.height = pullDist + 'px';
        banner.style.opacity = Math.min(1, pullDist / 30).toFixed(2);
        banner.style.marginBottom = Math.min(12, (pullDist / 54) * 12) + 'px';

        const rot = armed ? 180 : Math.min(180, pullDist * 3.5);
        if (iconWrap) iconWrap.style.transform = `rotate(${rot}deg)`;

        const THRESHOLD = 54;
        if (pullDist >= THRESHOLD && !armed) {
          armed = true;
          banner.classList.add('armed');
          if (textEl) textEl.textContent = "Release to refresh";
          haptic(HAPTIC.TICK);
        } else if (pullDist < THRESHOLD && armed) {
          armed = false;
          banner.classList.remove('armed');
          if (textEl) textEl.textContent = "Pull to refresh";
        }
      }
    }

    function onTouchEnd() {
      if (!activeContainer) return;

      const container = activeContainer;
      const banner = getBanner(container);

      if (isPulling && banner) {
        isPulling = false;
        banner.classList.remove('dragging');

        if (armed) {
          refreshing = true;
          armed = false;
          banner.classList.remove('armed');
          banner.classList.add('refreshing');

          const textEl = banner.querySelector('.ptr-text');
          if (textEl) textEl.textContent = "Refreshing...";

          haptic(HAPTIC.SUCCESS);

          setTimeout(() => {
            render(container);

            const newBanner = getBanner(container);
            if (newBanner) {
              newBanner.classList.add('refreshing', 'done');
              const newText = newBanner.querySelector('.ptr-text');
              if (newText) newText.textContent = "Refreshed!";
              const newIcon = newBanner.querySelector('.ptr-icon-wrap');
              if (newIcon) {
                newIcon.innerHTML = `<svg class="ptr-icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
              }

              setTimeout(() => {
                newBanner.classList.remove('refreshing', 'done');
                newBanner.classList.add('releasing');
                newBanner.style.height = '0px';
                newBanner.style.opacity = '0';
                newBanner.style.marginBottom = '0px';
                refreshing = false;
              }, 450);
            } else {
              refreshing = false;
            }
          }, 650);

        } else {
          banner.classList.add('releasing');
          banner.style.height = '0px';
          banner.style.opacity = '0';
          banner.style.marginBottom = '0px';
        }
      }

      activeContainer = null;
    }

    window.bindPullToRefresh = function(container) {
      if (!container) return;
      container.removeEventListener('touchstart', onTouchStart);
      container.removeEventListener('touchmove', onTouchMove);
      container.removeEventListener('touchend', onTouchEnd);
      container.removeEventListener('touchcancel', onTouchEnd);
      container.removeEventListener('mousedown', onTouchStart);
      container.removeEventListener('mousemove', onTouchMove);
      container.removeEventListener('mouseup', onTouchEnd);

      const currentView = window.currentActiveView || view;
      if (SUPPORTED_VIEWS.has(currentView)) {
        container.addEventListener('touchstart', onTouchStart, { passive: true });
        container.addEventListener('touchmove', onTouchMove, { passive: false });
        container.addEventListener('touchend', onTouchEnd);
        container.addEventListener('touchcancel', onTouchEnd);

        container.addEventListener('mousedown', (e) => {
          if (e.button === 0) onTouchStart(e);
        });
        container.addEventListener('mousemove', (e) => {
          if (e.buttons === 1) onTouchMove(e);
        });
        container.addEventListener('mouseup', onTouchEnd);
      }
    };
  })();

  /* ---------- bind ---------- */
  function bindView(c = ($current ? $current._scroll : null)) {
    ensureTick();
    if (c && window.forgeTransformDropdowns) window.forgeTransformDropdowns(c);
    if (!c) return;
    if (window.bindPullToRefresh) window.bindPullToRefresh(c);
    c.querySelector("#histQ")?.addEventListener("input", e=>{ ui.histQ=e.target.value; render(c); c.querySelector("#histQ")?.focus(); const el=c.querySelector("#histQ"); if(el) el.selectionStart=el.selectionEnd=el.value.length; });
    c.querySelector("#libQ")?.addEventListener("input", e=>{ ui.libQ=e.target.value; render(c); const el=c.querySelector("#libQ"); el?.focus(); if(el) el.selectionStart=el.selectionEnd=el.value.length; });
    c.querySelector("#progEx")?.addEventListener("change", e=>{ ui.progEx=e.target.value; render(c); });
    c.querySelector("#woNote")?.addEventListener("input", e=>{ if(S.active){ S.active.note=e.target.value; persistActive(); }});

    bindAllLongPress(c);

    $("#viewport").onclick = (e) => {
      const t = e.target.closest("[data-act],[data-go],[data-open-wo],[data-start-day],[data-toggle-ex],[data-step],[data-toggle-set],[data-add-set],[data-same-last],[data-warmup-gen],[data-rm-ex],[data-rm-set],[data-ex-note],[data-go-ex],[data-add-to-day],[data-move],[data-edit-item],[data-del-item],[data-mf],[data-plate-calc],[data-open-keypad]");
      if (!t) return;
      if (t.dataset.openKeypad) {
        if (t.blur) t.blur();
        openKeypadSheet(...t.dataset.openKeypad.split(":"));
      }
      if (t.dataset.plateCalc) togglePlatePopover(...t.dataset.plateCalc.split(":"), t);
      if (t.dataset.act) handleAct(t.dataset.act);
      if (t.dataset.go) go(t.dataset.go);
      if (t.dataset.openWo) {
        if (document.body.classList.contains("history-multi-mode")) {

        } else {
          openWorkout(t.dataset.openWo);
        }
      }
      if (t.dataset.startDay!=null) startDay(+t.dataset.startDay);
      if (t.dataset.toggleEx) {
        const id = t.dataset.toggleEx;
        const isCurrentlyOpen = ui.expand[id] !== false;
        ui.expand[id] = !isCurrentlyOpen;
        const card = t.closest(".ex-card");
        if (card) {
          card.classList.toggle("open", !isCurrentlyOpen);
          if (window.forgeJuice) {
            window.forgeJuice.click(!isCurrentlyOpen ? "done" : "tap");
          }
          if (window.spawnRipple && !isCurrentlyOpen) {
            window.spawnRipple(e.clientX, e.clientY, t);
          }
        } else {
          render();
        }
      }
      if (t.dataset.step) stepSet(...t.dataset.step.split(":"));
      if (t.dataset.toggleSet) toggleSet(...t.dataset.toggleSet.split(":"));
      if (t.dataset.addSet) addSet(t.dataset.addSet, t.dataset.type||"working");
      if (t.dataset.sameLast) sameLast(t.dataset.sameLast);
      if (t.dataset.warmupGen) warmupGen(t.dataset.warmupGen);
      if (t.dataset.rmSet) rmSet(...t.dataset.rmSet.split(":"));
      if (t.dataset.rmEx) {
        const exId = t.dataset.rmEx;
        const exName = getEx(exId).name || "this exercise";
        forgeConfirm({
          title: "Remove Exercise Block?",
          message: `Remove "${exName}" and all logged sets from your current live session?`,
          confirmText: "Remove Block",
          type: "danger",
          onConfirm: () => rmEx(exId)
        });
      }
      if (t.dataset.exNote) noteEx(t.dataset.exNote);
      if (t.dataset.goEx) openExercise(t.dataset.goEx);
      if (t.dataset.addToDay!=null) pickExercise(id => addToDay(+t.dataset.addToDay, id));
      if (t.dataset.move) moveItem(...t.dataset.move.split(":"));
      if (t.dataset.editItem) editItem(...t.dataset.editItem.split(":"));
      if (t.dataset.delItem) {
        const [dStr, id] = t.dataset.delItem.split(":");
        const dIdx = +dStr;
        const item = S.routine.days[dIdx]?.items.find(x=>x.id===id);
        const exName = item ? getEx(item.exerciseId).name : "this exercise";
        forgeConfirm({
          title: "Remove Exercise?",
          message: `Remove "${exName}" from ${S.routine.days[dIdx]?.name || "this day"}?`,
          confirmText: "Remove",
          type: "danger",
          onConfirm: () => delItem(dIdx, id)
        });
      }
      if (t.dataset.mf) { ui.exFilter=t.dataset.mf; render(); }
    };

    $$("[data-setv]").forEach(inp => {
      inp.addEventListener("change", () => writeSet(inp.dataset.setv, inp.value));
      inp.addEventListener("input", () => {
        if (activePlateState) updatePlatePopover();
      });
      inp.addEventListener("focus", () => {
        if (inp.dataset.openKeypad) inp.blur();
        else inp.select();
      });
    });
    $$("[data-day-name]").forEach(inp => {
      inp.addEventListener("change", () => {
        const i = +inp.dataset.dayName;
        S.routine.days[i].name = inp.value || "Session";
        save();
      });
    });
    $("#imp")?.addEventListener("change", importJSON);
  }

  function persistActive() {
    save();
  }

  function handleAct(act) {
    if (act==="start-today") startDay(new Date().getDay());
    if (act==="start-any" || act==="preview-today") go("workout");
    if (act==="start-empty") startEmpty();
    if (act==="resume") go("workout");
    if (act==="open-tools") openTools();
    if (act==="add-ex") pickExercise(id => {
      if (!S.active) return;
      const last = lastSessionFor(id, S.active.date);
      S.active.exercises.push(blockFromPlan({exerciseId:id, sets:3, reps:"8-10", rest:S.profile.defaultRest}, S.active.date));
      ui.expand[S.active.exercises.at(-1).id] = true;
      save(); render();
    });
    if (act==="finish-wo") finishModal();
    if (act==="cancel-wo") {
      forgeConfirm({
        title: "Discard Live Session?",
        message: "Are you sure you want to discard your current workout? All logged sets for this session will be lost.",
        confirmText: "Discard Session",
        type: "danger",
        onConfirm: () => { S.active = null; save(); render(); }
      });
    }
    if (act==="save-set") saveSettings();
    if (act==="export") exportJSON();
    if (act==="demo") { injectDemo(); toast("Sample camp loaded", "Six weeks of honest fiction."); render(); }
    if (act==="reset") {
      forgeConfirm({
        title: "Reset All Device Data?",
        message: "This will permanently erase all routines, workout logs, PRs, and body tracking data on this device. This cannot be undone.",
        confirmText: "Erase Everything",
        requireMatch: "RESET",
        type: "danger",
        onConfirm: () => { S = defaultState(); save(); location.reload(); }
      });
    }
    if (act==="add-bw") addBW();
    if (act==="add-meas") addMeas();
    if (act==="new-ex") newExModal();
    if (act==="apply-template") templateModal();
    if (act==="add-custom-day") toast("Clear a day by deleting its lifts, or switch template.");
  }

  function startDay(di, date=todayISO()) {

      forgeConfirm({

        confirmText: "Replace Session",
        type: "danger",

          S.active = makeSession(di, date);
          if (!S.active.exercises.length) S.active.name = S.routine.days[di]?.name || "Session";
          save(); go("workout"); requestWake();
          toast(S.active.name, "Session live. First working set whenever you're ready.");

      });

    }
    S.active = makeSession(di, date);
    if (!S.active.exercises.length) {
      S.active.name = S.routine.days[di]?.name || "Session";
    }
    save(); go("workout");
    requestWake();
    toast(S.active.name, "Session live. First working set whenever you're ready.");
  }
  function startEmpty() {
    S.active = { id:uid(), date:todayISO(), name:"Ad hoc", status:"active", started:Date.now(), ended:null, duration:0, feel:5, energy:5, soreness:3, sleep:7, note:"", exercises:[] };
    save(); go("workout"); requestWake();

  function syncActiveInputs() {
    document.querySelectorAll("[data-setv]").forEach(inp => {
      writeSet(inp.dataset.setv, inp.value);
    });
  }

  function updateSessionHeader() {
    if (!S.active) return;
    const wo = S.active;
    const doneSets = wo.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
    const totSets = wo.exercises.reduce((a,e)=>a+e.sets.length,0);
    const doneVol = volumeOf(wo);

    const statsSub = document.querySelector(".wo-head > div:first-child > div:last-child");
    if (statsSub) {
      statsSub.textContent = `${doneSets}/${totSets} sets · ${trimNum(toDisplay(doneVol))} ${u()} logged`;
    }

    const progBar = document.querySelector(".prog > i");
    if (progBar) {
      const pct = totSets ? (doneSets / totSets) : 0;
      progBar.style.setProperty("--p", pct);
      progBar.style.width = `${pct * 100}%`;
    }

  function renderExerciseSets(bid) {
    syncActiveInputs();
    const card = document.querySelector(`[data-excard="${bid}"]`);
    if (!card) return render();
    const b = S.active?.exercises.find(e => e.id === bid);
    if (!b) return render();
    const last = lastSessionFor(b.exerciseId, S.active.date);

    const setList = card.querySelector(".set-list");
    if (setList) {
      setList.innerHTML = b.sets.map((s, si) => setRow(b, s, si, last)).join("");
      setList.querySelectorAll("[data-setv]").forEach(inp => {
        inp.addEventListener("change", () => writeSet(inp.dataset.setv, inp.value));
        inp.addEventListener("focus", () => inp.select());
      });
    }

    const pill = card.querySelector(".ex-card-h .pill");
    if (pill) {
      const done = b.sets.length && b.sets.every(s => s.done);
      if (done) {
        pill.className = "pill lime";
        pill.textContent = "Done";
      } else {
        pill.className = "pill";
        pill.textContent = `${b.sets.filter(s => s.done).length}/${b.sets.length}`;
      }
    }

    updateSessionHeader();
  }

  function findSet(bid, sid) {
    const b = S.active?.exercises.find(e=>e.id===bid);
    const s = b?.sets.find(x=>x.id===sid);
    return {b,s};
  }
  function stepSet(bid,sid,field,dir) {
    const {b,s} = findSet(bid,sid); if(!s) return;
    dir = +dir;
    if (field==="w") {
      const cur = s.w? toDisplay(s.w) : 0;
      s.w = toKg(Math.max(0, cur + dir*inc()));
    } else if (field==="r") {
      s.r = Math.max(0, (Number(s.r)||0) + dir);
    } else if (field==="rpe") {
      s.rpe = clamp(Math.round(((Number(s.rpe)||7)+dir*0.5)*10)/10, 5, 10);
    }
    save();

    const key = `${bid}:${sid}:${field}`;
    const inp = document.querySelector(`input[data-setv="${key}"]`);
    if (inp) {
      if (field==="w") inp.value = s.w ? trimNum(toDisplay(s.w)) : "";
      else if (field==="r") inp.value = s.r || "";
      else if (field==="rpe") inp.value = s.rpe ? trimNum(Math.round(Number(s.rpe)*10)/10) : "";
    } else {
      renderExerciseSets(bid);
    }
    updateSessionHeader();
    if (activePlateState && activePlateState.bid === bid && activePlateState.sid === sid) {
      updatePlatePopover();
    }
  }
  function writeSet(key, val) {
    const [bid,sid,field] = key.split(":");
    const {s} = findSet(bid,sid); if(!s) return;
    if (field==="w") s.w = val===""?0:toKg(Number(val));
    if (field==="r") s.r = Number(val)||0;
    if (field==="rpe") s.rpe = val===""?"":clamp(Math.round((Number(val)||0)*10)/10, 0, 10);
    save();
    updateSessionHeader();
    if (activePlateState && activePlateState.bid === bid && activePlateState.sid === sid) {
      updatePlatePopover();
    }
  }
  function toggleSet(bid,sid) {
    const {b,s} = findSet(bid,sid); if(!s) return;
    s.done = !s.done;
    save();
    if (s.done) {
      const p = prsIgnoring(b.exerciseId, S.active.id);
      if ((s.w||0) > p.bestW && s.type!=="warmup") {
        toast("LOAD PR", `${getEx(b.exerciseId).name} · ${trimNum(toDisplay(s.w))} ${u()} × ${s.r}`);
      }
      if (S.profile.autoRest) startRest(b.rest || S.profile.defaultRest);
    }

    const checkBtn = document.querySelector(`[data-toggle-set="${bid}:${sid}"]`);
    if (checkBtn) {
      checkBtn.classList.toggle("on", s.done);
      checkBtn.textContent = s.done ? "✓" : "";
      const cardRow = checkBtn.closest(".set-card-row, tr");
      if (cardRow) {
        cardRow.classList.toggle("done", s.done);
        cardRow.setAttribute("data-done", s.done ? "true" : "false");
        const setNum = cardRow.querySelector(".set-num");
        if (setNum) setNum.classList.toggle("done", s.done);

      if (s.done && window.spawnSparkBurst) {
        window.spawnSparkBurst(checkBtn);

    }
    const card = document.querySelector(`[data-excard="${bid}"]`);
    if (card) {
      const pill = card.querySelector(".ex-card-h .pill");
      if (pill) {
        const done = b.sets.length && b.sets.every(x => x.done);
        if (done) {
          pill.className = "pill lime";
          pill.textContent = "Done";
        } else {
          pill.className = "pill";
          pill.textContent = `${b.sets.filter(x => x.done).length}/${b.sets.length}`;
        }
      }
    }
    updateSessionHeader();
  }
  function addSet(bid, type) {
    syncActiveInputs();
    const b = S.active?.exercises.find(e=>e.id===bid);
    if (!b) return;
    const last = [...b.sets].reverse().find(s=>s.type===type) || b.sets.at(-1) || {w:0,r:8,rpe:7.5};
    b.sets.push({id:uid(), type, w:last.w||0, r:last.r||8, rpe:last.rpe||7.5, done:false});
    save();
    renderExerciseSets(bid);
  }
  function rmSet(bid, sid) {
    syncActiveInputs();
    const b = S.active?.exercises.find(e=>e.id===bid);
    if (!b) return;
    b.sets = b.sets.filter(s=>s.id!==sid);
    save();
    renderExerciseSets(bid);
    toast("Set removed");
  }
  function sameLast(bid) {
    syncActiveInputs();
    const b = S.active?.exercises.find(e=>e.id===bid);
    if (!b) return;
    const last = lastSessionFor(b.exerciseId, S.active.date);
    if (!last) return toast("No previous session");
    
    const lastSets = last.block.sets;
    let populatedCount = 0;

    b.sets.forEach((s, idx) => {
      if (!s.done && (!s.w || s.w === 0) && (!s.r || s.r === 0) && lastSets[idx]) {
        s.w = lastSets[idx].w || 0;
        s.r = lastSets[idx].r || 0;
        if (lastSets[idx].rpe !== undefined) s.rpe = lastSets[idx].rpe;
        s.auto = true;
        populatedCount++;
      }
    });

    if (populatedCount === 0) {
      b.sets = lastSets.map(s => ({ ...s, id: uid(), done: false, auto: true }));
      populatedCount = b.sets.length;
    }

    save();
    renderExerciseSets(bid);
    toast("Copied last session", `Populated ${populatedCount} set${populatedCount > 1 ? "s" : ""}`);
  }
  function warmupGen(bid) {
    syncActiveInputs();
    const b = S.active?.exercises.find(e=>e.id===bid);
    if (!b) return;

    let top = 0;
    const work = b.sets.find(s => s.type === "working" && Number(s.w) > 0) || b.sets.find(s => Number(s.w) > 0);
    if (work) {
      top = Number(work.w) || 0;
    }

    if (!top) {
      const last = lastSessionFor(b.exerciseId, S.active.date);
      if (last) {
        const prevWork = last.block.sets.find(s => s.type === "working" && Number(s.w) > 0) || last.block.sets.find(s => Number(s.w) > 0);
        if (prevWork) top = Number(prevWork.w) || 0;
      }
    }

    if (!top) {
      return toast("Set a working weight first", "Enter a weight for your working set to generate warm-ups.");
    }

    const ladder = [0.4, 0.6, 0.8].map((p, i) => ({
      id: uid(),
      type: "warmup",
      w: toKg(Math.round(toDisplay(top) * p * 4) / 4),
      r: [8, 5, 3][i],
      rpe: 5,
      done: false
    }));

    b.sets = [...ladder, ...b.sets.filter(s => s.type !== "warmup")];
    save();
    renderExerciseSets(bid);
    toast("Warm-up ladder ready", `Generated 3 warm-up sets based on ${trimNum(toDisplay(top))} ${u()}`);
  }
  function rmEx(bid) {
    S.active.exercises = S.active.exercises.filter(e=>e.id!==bid);
    save(); render();
  }
  function noteEx(bid) {
    const b = S.active?.exercises.find(e=>e.id===bid);
    if (!b) return;
    const exName = getEx(b.exerciseId).name;
    showOverlay(`
      <h2>${esc(exName)} Note</h2>

  function drawRest() {
    const pct = rest.total? rest.left/rest.total : 0;
    const C = 2*Math.PI*88;
    const offset = C*(1-pct);
    $("#restOv").innerHTML = `
      <div class="rest-card">
        <div class="hero-kicker">Rest</div>
        <div class="ring-wrap">
          <svg width="220" height="220" viewBox="0 0 200 200">

            <circle id="restRing" cx="100" cy="100" r="88" fill="none" stroke="var(--accent)" stroke-width="12"
              stroke-dasharray="${C}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
          </svg>
          <div class="ring-time" id="restTime">${fmtRest(rest.left)}</div>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">

    };

      rest.endTime += 30000;

  function updateRestUI() {
    const elTime = $("#restTime");

    const elRing = $("#restRing");
    if (elRing && rest.total) {
      const C = 2*Math.PI*88;
      const pct = Math.max(0, Math.min(1, rest.left/rest.total));
      elRing.setAttribute("stroke-dashoffset", (C*(1-pct)).toFixed(1));

  function beep() {
    try {
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type="sine"; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
      o.start(); o.stop(ctx.currentTime+0.36);
    } catch(e) {}
  }

  /* FORGE Masterclass Custom Interactive Web Calendar Picker Engine */
  window.forgeDatePicker = (inputEl) => {
    if (!inputEl) return;
    let currDate = inputEl.value ? new Date(inputEl.value + "T00:00:00") : new Date();
    if (isNaN(currDate.getTime())) currDate = new Date();

    let viewYear = currDate.getFullYear();
    let viewMonth = currDate.getMonth();

    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    let overlay = document.getElementById("forgeDatePickerOverlay");
    if (overlay) overlay.remove();

    overlay = document.createElement("div");
    overlay.id = "forgeDatePickerOverlay";
    overlay.className = "forge-datepicker-overlay";

    const renderCalendar = () => {
      const firstDay = new Date(viewYear, viewMonth, 1);
      const lastDay = new Date(viewYear, viewMonth + 1, 0);
      const startDayIdx = (firstDay.getDay() + 6) % 7; // Monday start
      const totalDays = lastDay.getDate();

      const prevMonthLastDay = new Date(viewYear, viewMonth, 0).getDate();

      let daysHTML = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div class="dp-day-header">${d}</div>`).join("");

      // Muted previous month days
      for (let i = startDayIdx - 1; i >= 0; i--) {
        daysHTML += `<div class="dp-day muted">${prevMonthLastDay - i}</div>`;
      }

      const todayStr = todayISO();
      const selectedStr = inputEl.value;

      // Current month days
      for (let day = 1; day <= totalDays; day++) {
        const mStr = String(viewMonth + 1).padStart(2, "0");
        const dStr = String(day).padStart(2, "0");
        const iso = `${viewYear}-${mStr}-${dStr}`;
        const isSelected = iso === selectedStr;
        const isToday = iso === todayStr;

        daysHTML += `<div class="dp-day num ${isSelected ? "selected" : ""} ${isToday ? "today" : ""}" data-iso="${iso}">${day}</div>`;
      }

      overlay.innerHTML = `
        <div class="forge-datepicker-modal">
          <div class="forge-datepicker-header">
            <button type="button" class="icon-btn" id="dpPrev">‹</button>
            <div class="forge-datepicker-title">${months[viewMonth]} ${viewYear}</div>
            <button type="button" class="icon-btn" id="dpNext">›</button>
          </div>
          <div class="forge-datepicker-grid">
            ${daysHTML}
          </div>
          <div class="forge-datepicker-actions">
            <button type="button" class="btn ghost sm" id="dpToday">Today</button>
            <button type="button" class="btn primary sm" id="dpClose">Done</button>
          </div>
        </div>
      `;

      overlay.querySelector("#dpPrev").onclick = () => {
        viewMonth--;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        renderCalendar();
      };
      overlay.querySelector("#dpNext").onclick = () => {
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        renderCalendar();
      };
      overlay.querySelector("#dpToday").onclick = () => {
        inputEl.value = todayISO();
        inputEl.dispatchEvent(new Event("change", { bubbles: true }));
        close();
      };
      overlay.querySelector("#dpClose").onclick = () => close();

      overlay.querySelectorAll(".dp-day.num").forEach(cell => {
        cell.onclick = () => {
          inputEl.value = cell.dataset.iso;
          inputEl.dispatchEvent(new Event("change", { bubbles: true }));
          if (window.forgeJuice?.click) window.forgeJuice.click("tap");
          close();
        };
      });
    };

    const close = () => {
      overlay.classList.remove("show");
      setTimeout(() => overlay.remove(), 220);
    };

    overlay.onclick = (e) => { if (e.target === overlay) close(); };

    document.body.appendChild(overlay);
    renderCalendar();
    requestAnimationFrame(() => overlay.classList.add("show"));
  };

      const modal = e.target.closest(".overlay.show .modal, .forge-lp-sheet.open");
      if (!modal || window.innerWidth > 860) return;

      const touch = e.touches[0];
      const rect = modal.getBoundingClientRect();
      const isHeaderTouch = (touch.clientY - rect.top) < 64;

      if (modal.scrollTop > 2 && !isHeaderTouch) return;

      activeModal = modal;
      startY = touch.clientY;
      startX = touch.clientX;
      isDraggingModal = false;
    }, { passive: true });

    document.addEventListener("touchmove", (e) => {
      if (!activeModal) return;
      const touch = e.touches[0];
      const dy = touch.clientY - startY;
      const dx = touch.clientX - startX;

      if (dy < 0 || Math.abs(dx) > Math.abs(dy)) {
        if (!isDraggingModal) {
          activeModal = null;
          return;
        }
      }

      if (dy > 10) {
        if (activeModal.scrollTop > 2 && !e.target.closest(".modal::before, .forge-lp-sheet-hdr, h2, .sub")) {
          activeModal = null;
          return;
        }
        isDraggingModal = true;
        activeModal.style.transform = `translate3d(0, ${dy}px, 0)`;
        activeModal.style.transition = "none";
      }
    }, { passive: true });

      if (!activeModal) return;
      if (isDraggingModal) {

  load();

})();

<script>
(() => {
  document.documentElement.setAttribute("data-juice", "1");

  /* ---------- Web Audio: 80Hz pop + celebration chime ---------- */
  let actx, master;
  const bootAudio = () => {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.16;
    master.connect(actx.destination);
  };
  const resume = () => { bootAudio(); if (actx && actx.state === "suspended") actx.resume(); };

  const tone = (freq, t, dur, type, gain, slide) => {
    if (!actx) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    const f = actx.createBiquadFilter();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur * 0.7);
    f.type = "lowpass";
    f.frequency.value = Math.max(freq * 4, 240);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  };

  const click = (kind = "tap") => {
    if (!actx) return;

      tone(660, t, 0.09, "triangle", 0.14);

      tone(523, t, 0.1, "triangle", 0.12);

  addEventListener("pointermove", (e) => {

  }, { passive: true });

  const COLORS = ["#d6ff3f", "#9dff57", "#f4ffb0", "#ffffff", "#6ea8ff", "#ff8a4c"];
  const fireworks = (x, y, n = 32) => {

    const bits = [];
    for (let i = 0; i < n; i++) {
      const el = document.createElement("i");
      const ang = Math.random() * Math.PI * 2;
      const spd = 6 + Math.random() * 11;
      el.style.background = COLORS[i % COLORS.length];
      el.style.color = el.style.background;
      el.style.width = 4 + Math.random() * 6 + "px";
      el.style.height = 3 + Math.random() * 8 + "px";
      layer.appendChild(el);
      bits.push({
        el, x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 6,
        rot: Math.random() * 360,
        vr: -12 + Math.random() * 24,
        life: 1
      });
    }
    document.body.appendChild(layer);
    const step = () => {
      let alive = false;
      for (const p of bits) {
        p.vy += 0.42;
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life -= 0.016;
        if (p.life > 0) {
          alive = true;
          p.el.style.opacity = Math.max(p.life, 0).toFixed(3);
          p.el.style.transform = `translate3d(${p.x}px,${p.y}px,0) rotate(${p.rot}deg)`;
        }
      }
      if (alive) requestAnimationFrame(step);
      else layer.remove();
    };
    requestAnimationFrame(step);

  /* ---------- CountUp ---------- */
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  window.forgeCountUp = (el, to, { dur = 700, prefix = "", suffix = "", decimals = 0 } = {}) => {
    if (!el) return;
    const from = parseFloat(el.dataset.v || "0") || 0;
    const start = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - start) / dur);
      const v = from + (to - from) * easeOut(p);
      el.textContent = prefix + v.toFixed(decimals) + suffix;
      if (p < 1) requestAnimationFrame(tick);
      else { el.dataset.v = to; el.textContent = prefix + Number(to).toFixed(decimals) + suffix; }
    };
    requestAnimationFrame(tick);

  /* ---------- Stagger + progress bars as scaleX ---------- */
  let lastViewName = "";
  const decorate = (root) => {
    if (!root) return;
    const isNewTab = (window.currentActiveView !== lastViewName);

      lastViewName = window.currentActiveView;
      root.classList.remove("view-enter");
      void root.offsetWidth;
      root.classList.add("view-enter");
      [...root.querySelectorAll(".card, .ex-row, .hist-row, .lib-row, .ex-card")]

      [...root.querySelectorAll(".card, .ex-row, .hist-row, .lib-row, .ex-card")]

    root.querySelectorAll(".prog > i").forEach((bar) => {

        ? parseFloat(bar.style.width) / 100
        : (bar.parentElement.clientWidth ? bar.getBoundingClientRect().width / bar.parentElement.clientWidth : 0);

    root.querySelectorAll(".chart-svg circle.pt").forEach((c, i) => c.style.setProperty("--i", i));
    root.querySelectorAll(".stat .val").forEach((el) => {
      if (el.classList.contains("count-up")) return;
      const raw = (el.textContent || "").trim();

      if (!m) return;
      const num = parseFloat(m[0]);
      const [pre, post] = raw.split(m[0]);
      el.classList.add("count-up");
      el.textContent = (pre || "") + "0" + (post || "");
      window.forgeCountUp(el, num, {
        prefix: pre || "",
        suffix: post || "",
        decimals: m[0].includes(".") ? (m[0].split(".")[1] || "").length : 0,
        dur: 640
      });
    });
  };

  /* ---------- Event fabric (Mobile Touch & Pointer Spring System) ---------- */
  addEventListener("pointerdown", (e) => {
    resume();
    const control = e.target.closest("button, .btn, .icon-btn, .check, input, textarea, select, a, [data-act], [data-go], [data-open-wo], [data-start-day], [data-toggle-ex], [data-step], [data-toggle-set], [data-add-set], [data-same-last], [data-warmup-gen], [data-rm-ex], [data-ex-note], [data-go-ex]");
    const tile = control || e.target.closest(".card, .ex-card, .ex-row, .hist-row, .lib-row, .stat, .pill, .split-opt");
    if (tile) tile.classList.add("is-pressed");
    const check = e.target.closest(".check");
    if (check) {
      const willOn = !check.classList.contains("on");
      click(willOn ? "done" : "tap");
      return;
    }
    if (tile) click("tap");
    if (e.target.closest(".pill.lime") && /PR/i.test(e.target.textContent || "")) {
      click("pr");
      e.target.closest(".pill")?.classList.add("pr-flare");
    }
  }, { passive: true });

  const releasePressed = () => {
    document.querySelectorAll(".is-pressed").forEach((tile) => tile.classList.remove("is-pressed"));
  };

  addEventListener("pointerup", releasePressed, { passive: true });
  addEventListener("pointercancel", releasePressed, { passive: true });
  addEventListener("pointerleave", releasePressed, { passive: true });

  addEventListener("pointermove", (e) => {
    const card = e.target.closest(".juice-tilt.card, .juice-tilt.ex-card, .card.hero");
    if (card && matchMedia("(hover:hover) and (pointer:fine)").matches) tilt(card, e);
  }, { passive: true });

  addEventListener("pointerleave", (e) => {
    const card = e.target.closest?.(".juice-tilt");
    if (card) untilt(card);
  }, true);

  document.addEventListener("mouseout", (e) => {
    const card = e.target.closest?.(".juice-tilt");
    if (card && !card.contains(e.relatedTarget)) untilt(card);
  }, true);

  /* observe view swaps */


  /* celebrate PR toasts */
  const toasts = document.getElementById("toasts");
  if (toasts) {
    new MutationObserver((muts) => {
      for (const m of muts) for (const n of m.addedNodes) {

  }

  window.forgeJuice = { click, fireworks, decorate, resume };
})();

    f.type = "lowpass";
    f.frequency.value = 320;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

<!-- FORGE routine touch/mouse reorder -->
<script>
(() => {
  const ITEM = ".routine-drag-item";
  const THRESHOLD = 5;
  let drag = null;

  const daysOf = () => window.S?.routine?.days || null;

  const listOf = (el) =>
    el.closest(".exercise-list") ||
    el.closest("[data-day]") ||
    el.closest(".card");

  const itemsOf = (list) =>
    [...list.querySelectorAll(ITEM)].filter((n) => n.parentElement === list || list.contains(n));

  const clearOver = (list) =>
    list.querySelectorAll(".drag-over").forEach((n) => n.classList.remove("drag-over"));

  const indexFromY = (list, y) => {
    const rows = itemsOf(list);
    let idx = rows.length;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) { idx = i; break; }
    }
    return idx;
  };

  const blockScroll = (e) => {
    if (!drag?.live) return;
    e.preventDefault();
  };

  const commit = (day, from, to) => {
    if (from === to || from < 0 || to < 0) return;
    const days = daysOf();
    const items = days?.[day]?.items;
    if (!Array.isArray(items) || from >= items.length) return;
    const [moved] = items.splice(from, 1);
    items.splice(to, 0, moved);
    window.save?.();
    window.render?.();
  };

  const decorate = (root = document.getElementById("content")) => {
    if (!root || drag) return;
    root.querySelectorAll("[data-add-to-day], [data-day-name], [data-day]").forEach((mark) => {
      const day = +(mark.dataset.addToDay ?? mark.dataset.dayName ?? mark.dataset.day);
      if (Number.isNaN(day)) return;
      const card = mark.closest(".card, .routine-day-card") || mark;
      let list = card.querySelector(".exercise-list");
      if (!list) {
        list = document.createElement("div");
        list.className = "exercise-list";
        const rows = [...card.querySelectorAll(".lib-row")];
        if (!rows.length) return;
        rows[0].parentElement.insertBefore(list, rows[0]);
        rows.forEach((r) => list.appendChild(r));
      }
      list.querySelectorAll(".lib-row, " + ITEM).forEach((row, idx) => {
        row.classList.add("routine-drag-item");
        row.dataset.dragDay = String(day);
        row.dataset.dragIdx = String(idx);
        if (!row.querySelector(".drag-handle")) {
          const h = document.createElement("button");
          h.type = "button";
          h.className = "drag-handle";
          h.setAttribute("aria-label", "Drag to reorder");
          h.innerHTML = "<span></span><span></span>";
          row.insertBefore(h, row.firstChild);
        }
      });
    });
  };

  const start = (e, row) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const list = listOf(row);
    if (!list) return;
    const rows = itemsOf(list);
    const from = rows.indexOf(row);
    if (from < 0) return;

    drag = {
      row, list, from,
      day: +row.dataset.dragDay,
      pointerId: e.pointerId,
      x0: e.clientX,
      y0: e.clientY,
      live: false,
      to: from,
      ghost: null,
      ox: 0, oy: 0
    };

    try { row.setPointerCapture(e.pointerId); } catch (_) {}
  };

  const lift = (e) => {
    const d = drag;
    if (!d || d.live) return;
    d.live = true;
    const r = d.row.getBoundingClientRect();
    d.ox = e.clientX - r.left;
    d.oy = e.clientY - r.top;

    const ghost = d.row.cloneNode(true);
    ghost.classList.add("drag-ghost");
    ghost.classList.remove("is-dragging", "drag-over");
    ghost.style.width = r.width + "px";
    ghost.style.transform = `translate3d(${r.left}px,${r.top}px,0)`;
    document.body.appendChild(ghost);
    d.ghost = ghost;

    d.row.classList.add("is-dragging");
    document.documentElement.classList.add("is-row-dragging");
    document.addEventListener("touchmove", blockScroll, { passive: false });
    window.forgeJuice?.click?.("tap");
  };

  const move = (e) => {
    const d = drag;
    if (!d) return;
    if (e.cancelable) e.preventDefault();

    if (!d.live) {
      if (Math.abs(e.clientY - d.y0) < THRESHOLD && Math.abs(e.clientX - d.x0) < THRESHOLD) return;
      lift(e);
    }
    if (!d.live) return;

    const x = e.clientX - d.ox;
    const y = e.clientY - d.oy;
    d.ghost.style.transform = `translate3d(${x}px,${y}px,0)`;

    const next = indexFromY(d.list, e.clientY);
    d.to = d.from < next ? next - 1 : next;
    clearOver(d.list);
    const rows = itemsOf(d.list);
    const hover = rows[next] || rows[rows.length - 1];
    if (hover && hover !== d.row) hover.classList.add("drag-over");
  };

  const end = (e) => {
    const d = drag;
    if (!d) return;
    try { d.row.releasePointerCapture(d.pointerId); } catch (_) {}

    const did = d.live;
    const { day, from } = d;
    let { to } = d;
    const rows = itemsOf(d.list);
    if (did && e && typeof e.clientY === "number") {
      const next = indexFromY(d.list, e.clientY);
      to = from < next ? next - 1 : next;
    }

    d.ghost?.remove();
    d.row.classList.remove("is-dragging");
    clearOver(d.list);
    document.documentElement.classList.remove("is-row-dragging");
    document.removeEventListener("touchmove", blockScroll);
    drag = null;

    if (!did) return;

    to = Math.max(0, Math.min(to, rows.length - 1));
    if (from !== to) commit(day, from, to);
  };

  document.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button, input, textarea, select, .icon-btn, [data-del-item], [data-edit-item], [data-move]")) {
      if (!e.target.closest(".drag-handle")) return;
    }
    const handle = e.target.closest(".drag-handle");
    const row = handle
      ? handle.closest(ITEM)
      : (e.target.closest(ITEM) && !e.target.closest("button, .icon-btn, [data-del-item], [data-edit-item], [data-move]") ? e.target.closest(ITEM) : null);
    if (!row) return;
    start(e, row);
  });

  document.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    move(e);
  });

  document.addEventListener("pointerup", (e) => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    end(e);
  });

  document.addEventListener("pointercancel", () => { if (drag) end(); });

  const content = document.getElementById("content");
  if (content) decorate(content);

  // Compositor-Driven Kinetic Strike Boot Splash lifecycle
  (function initBootSplash() {
    const boot = document.getElementById("boot");
    if (!boot) return;

    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const END = 2800, PAD = 400;

    // Generate 96x96 noise texture tile once into grain background
    try {
      const gc = document.createElement("canvas");
      gc.width = gc.height = 96;
      const g = gc.getContext("2d");
      const id = g.createImageData(96, 96);
      for (let i = 0; i < id.data.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        id.data[i] = id.data[i+1] = id.data[i+2] = v;
        id.data[i+3] = 255;
      }
      g.putImageData(id, 0, 0);
      const grainEl = boot.querySelector(".boot-grain");
      if (grainEl) grainEl.style.backgroundImage = `url(${gc.toDataURL()})`;
    } catch (_) {}

    // Teardown handler
    let finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      boot.classList.add("boot--done");
      setTimeout(() => {
        boot.remove();
        document.dispatchEvent(new CustomEvent("vant:bootend"));
      }, 200);
    }

    if (reduced) {
      setTimeout(finish, 400);
    } else {
      const scene = boot.querySelector(".scene");
      if (scene) {
        scene.addEventListener("animationend", (e) => {
          if (e.animationName === "scene-exit") finish();
        });
      }
      setTimeout(finish, END + PAD);
    }
  })();
})();
</script>
