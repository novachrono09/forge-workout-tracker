  /* ---------- Masterclass Theme-Customized Charts ---------- */
  function lineSVG(points, {w=560, h=190, color="var(--accent)", fill=true, yfmt=v=>trimNum(v)}={}) {
    if (!points.length) return `<div class="empty">No data logged yet</div>`;
    const padL=42, padR=16, padT=20, padB=28;
    const ys = points.map(p=>p.y);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);
    const span = (maxY - minY) || 1;

    const X = i => padL + (i / Math.max(points.length - 1, 1)) * (w - padL - padR);
    const Y = y => padT + (1 - ((y - minY) / span)) * (h - padT - padB);

    const coords = points.map((p, i) => ({ x: X(i), y: Y(p.y), orig: p }));

    // Generate smooth cubic bezier curve path
    let d = "";
    if (coords.length === 1) {
      d = `M${coords[0].x},${coords[0].y} L${coords[0].x + 1},${coords[0].y}`;
    } else {
      d = `M ${coords[0].x.toFixed(1)},${coords[0].y.toFixed(1)}`;
      for (let i = 0; i < coords.length - 1; i++) {
        const p0 = coords[i === 0 ? i : i - 1];
        const p1 = coords[i];
        const p2 = coords[i + 1];
        const p3 = coords[i + 2 < coords.length ? i + 2 : i + 1];

        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        d += ` C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
      }
    }

    const area = `${d} L${coords[coords.length - 1].x.toFixed(1)},${h - padB} L${coords[0].x.toFixed(1)},${h - padB} Z`;

    const gradId = `chartGrad_${Math.random().toString(36).substr(2, 6)}`;
    const glowId = `chartGlow_${Math.random().toString(36).substr(2, 6)}`;

    const gridLines = [0, 0.33, 0.66, 1].map(ratio => {
      const yy = padT + ratio * (h - padT - padB);
      const val = maxY - ratio * span;
      return `
        <line x1="${padL}" x2="${w - padR}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4 4"/>
        <text x="${padL - 6}" y="${yy + 3}" text-anchor="end" fill="var(--faint, #8b93a7)" font-size="9.5" font-family="var(--mono)">${esc(yfmt(val))}</text>
      `;
    }).join("");

    const dots = coords.map((c, i) => `
      <g class="chart-node" data-i="${i}" style="cursor:pointer">
        <circle cx="${c.x}" cy="${c.y}" r="6" fill="${color}" opacity="0.25"/>
        <circle cx="${c.x}" cy="${c.y}" r="3.5" fill="${color}" stroke="#07080b" stroke-width="1.5"/>
      </g>
    `).join("");

    const labs = coords.filter((_, i) => coords.length < 8 || i === 0 || i === coords.length - 1 || i % Math.ceil(coords.length / 5) === 0).map(c => `
      <text x="${c.x}" y="${h - 6}" text-anchor="middle" fill="var(--faint, #8b93a7)" font-size="9" font-family="var(--mono)">${esc(c.orig.x)}</text>
    `).join("");

    return `
      <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible" data-pts='${esc(JSON.stringify(points))}'>
        <defs>
          <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0.0"/>
          </linearGradient>
          <filter id="${glowId}" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>
        ${gridLines}
        ${fill ? `<path d="${area}" fill="url(#${gradId})"/>` : ""}
        <path d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" filter="url(#${glowId})"/>
        ${dots}
        ${labs}
      </svg>
    `;
  }

  function barSVG(items, {w=560, h=190, color="var(--accent)"}={}) {
    if (!items.length) return `<div class="empty">No data logged yet</div>`;
    const padL=32, padR=12, padT=16, padB=28;
    const max = Math.max(...items.map(i => i.y), 1);
    const bw = (w - padL - padR) / items.length;

    const bars = items.map((it, i) => {
      const bh = Math.max((it.y / max) * (h - padT - padB), it.y > 0 ? 4 : 2);
      const x = padL + i * bw + bw * 0.16;
      const width = bw * 0.68;
      const y = h - padB - bh;
      const barColor = it.color || color;
      const isZero = !it.y;

      return `
        <g class="bar-group" style="cursor:pointer">
          <rect x="${x}" y="${y}" width="${width}" height="${bh}" rx="6" ry="6"
            fill="${isZero ? "rgba(255,255,255,0.04)" : barColor}"
            opacity="${isZero ? "0.4" : "0.88"}"
            style="transition: all 0.2s ease"
            data-l="${esc(it.x + ': ' + trimNum(it.y))}"/>
          ${!isZero ? `<rect x="${x}" y="${y}" width="${width}" height="2" rx="1" fill="#ffffff" opacity="0.4"/>` : ""}
          <text x="${x + width / 2}" y="${h - 8}" text-anchor="middle" fill="var(--faint, #8b93a7)" font-size="9.5" font-family="var(--mono)">${esc(it.x)}</text>
        </g>
      `;
    }).join("");

    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;overflow:visible">${bars}</svg>`;
  }

  function donutSVG(parts, {size=160} = {}) {
    const tot = parts.reduce((a, p) => a + p.v, 0) || 1;
    let a = -Math.PI / 2;
    const r = 56, cx = 80, cy = 80, sw = 16;
    
    const segs = parts.map(p => {
      const ang = (p.v / tot) * Math.PI * 2;
      const gap = parts.length > 1 ? 0.05 : 0;
      const startA = a + gap / 2;
      const endA = a + ang - gap / 2;
      a += ang;

      const x1 = cx + r * Math.cos(startA), y1 = cy + r * Math.sin(startA);
      const x2 = cx + r * Math.cos(endA), y2 = cy + r * Math.sin(endA);
      const large = (endA - startA) > Math.PI ? 1 : 0;

      return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${p.c}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
    }).join("");

    return `
      <svg width="${size}" height="${size}" viewBox="0 0 160 160" style="overflow:visible">
        <circle cx="80" cy="80" r="${r}" stroke="rgba(255,255,255,0.05)" stroke-width="${sw}" fill="none"/>
        ${segs}
        <circle cx="80" cy="80" r="${r - sw/2 - 4}" fill="rgba(13,15,21,0.6)"/>
        <text x="80" y="74" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="800" font-family="var(--mono)">${parts.length}</text>
        <text x="80" y="93" text-anchor="middle" fill="var(--muted)" font-size="10" font-weight="600" letter-spacing="0.05em">MUSCLES</text>
      </svg>
    `;
  }

  /* ---------- navigation ---------- */
  /* ═══════════════════════════════════════════════════════════
     FORGE OS — Native Navigation Engine
     Two-layer slide transitions · history stack · swipe-back
     ═══════════════════════════════════════════════════════════ */

  const ROOT_TABS = ['dashboard', 'workout', 'routine', 'progress', 'body'];
  const TAB_INDEX = Object.fromEntries(ROOT_TABS.map((v, i) => [v, i]));
  const VIEWS = new Set(['dashboard', 'workout', 'history', 'progress',
                         'routine', 'exercises', 'body', 'settings']);

  const TITLES = {
    dashboard:["Command Center","Overview of training, recovery and iron"],
    workout:["Session","Log sets as they happen"],
    history:["History","Every session, searchable"],
    progress:["Progress","Overload, volume, balance"],
    routine:["Routine Architect","Set it once. Train it forever."],
    exercises:["Exercise Library","Cues, PRs and history"],
    body:["Body Log","Scale, tape, how you feel"],
    settings:["Settings","Units, backups, preferences"]
  };

  const NAV_CONFIG = {
    DUR:          { push: 340, pop: 340, tab: 280 },
    PARALLAX:     25,
    TAB_PARALLAX: 15,
    DIM:          0.32,
    EDGE:         30,
    ARM:          12,
    COMMIT:       0.35,
    VELOCITY:     0.5
  };

  let navigationStack = [];
  let navLock = false;
  let pendingPop = null;
  let popIntent = null;
  let incomingView = null;
  let navSeq = Date.now();
  const tabScroll = {};

  let $current, $incoming;

  const setX = (el, v) => { el.style.transform = `translate3d(${v},0,0)`; };

  function captureScroll() {
    const top = navigationStack[navigationStack.length - 1];
    if (!top || !$current) return;
    top.scroll = $current._scroll.scrollTop;
    if (ROOT_TABS.includes(top.view)) tabScroll[top.view] = top.scroll;
  }

  function renderView(v, el, data = null) {
    view = v;
    window.currentActiveView = v;
    render(el, data);
  }

  function performTransition({ type, dir = 1, targetView, targetData = null,
                               restoreScroll = 0, fromSwipe = false }) {
    const dur  = NAV_CONFIG.DUR[type] || 320;
    const fromEl = $current, toEl = $incoming;

    if (fromSwipe) type = 'pop';

    const preStaged = fromSwipe && incomingView === targetView;

    let toFrom, toTo, fromTo, dimEl = null, dimTo = 0;
    if (type === 'push') {
      toFrom = '100%'; toTo = '0%'; fromTo = `-${NAV_CONFIG.PARALLAX}%`;
      dimEl = fromEl._dim; dimTo = NAV_CONFIG.DIM;
    } else if (type === 'pop') {
      toFrom = `-${NAV_CONFIG.PARALLAX}%`; toTo = '0%'; fromTo = '100%';
      dimEl = toEl._dim; dimTo = 0;
    } else { // tab
      toFrom = dir > 0 ? '100%' : '-100%'; toTo = '0%';
      fromTo = dir > 0 ? `-${NAV_CONFIG.TAB_PARALLAX}%` : `${NAV_CONFIG.TAB_PARALLAX}%`;
    }

    return new Promise(resolve => {
      if (preStaged) {
        fromTo = window.innerWidth + 'px';
        dimEl  = toEl._dim; dimTo = 0;
      } else {
        renderView(targetView, toEl._scroll, targetData);
        toEl._scroll.scrollTop = restoreScroll || 0;
        incomingView = targetView;
        toEl.classList.add('active');
        fromEl.style.zIndex = type === 'pop' ? 2 : 1;
        toEl.style.zIndex   = type === 'pop' ? 1 : 2;
        setX(toEl, toFrom);
        setX(fromEl, '0%');
        if (dimEl) dimEl.style.opacity = (type === 'push') ? 0 : NAV_CONFIG.DIM;
        void toEl.offsetWidth;
      }

      $('#viewport')?.classList.add('animating');
      for (const el of [fromEl, toEl]) {
        el.classList.remove('dragging');
        el.classList.add('animating');
        el.style.transitionDuration = dur + 'ms';
      }
      if (dimEl) dimEl.style.transitionDuration = dur + 'ms';

      setX(toEl, toTo);
      setX(fromEl, fromTo);
      if (dimEl) dimEl.style.opacity = dimTo;

      let done = false;
      const finish = () => {
        if (done) return; done = true;
        clearTimeout(timer);
        toEl.removeEventListener('transitionend', onEnd);

        for (const el of [fromEl, toEl]) {
          el.classList.remove('animating', 'dragging');
          el.style.transitionDuration = '';
          el.style.zIndex = '';
          setX(el, '0%');
          el._dim.style.opacity = 0;
          el._dim.style.transitionDuration = '';
        }
        fromEl.classList.remove('active');
        fromEl._scroll.innerHTML = '';
        $('#viewport')?.classList.remove('animating');
        incomingView = null;
        [$current, $incoming] = [$incoming, $current];
        resolve();
      };
      const onEnd = e => {
        if (e.target === toEl && e.propertyName === 'transform') finish();
      };
      toEl.addEventListener('transitionend', onEnd);
      const timer = setTimeout(finish, dur + 100);
    });
  }

  async function commitNavigation(entry, { type, dir = 1, fromSwipe = false }) {
    navLock = true;
    view = entry.view;
    updateChrome();
    try {
      await performTransition({
        type, dir,
        targetView: entry.view,
        targetData: entry.data,
        restoreScroll: entry.scroll || 0,
        fromSwipe
      });
    } finally {
      navLock = false;
    }
    processPending();
  }

  function go(target, data = null) {
    if (navLock || !target) return;
    if (target === view) {
      if ($current?._scroll) $current._scroll.scrollTop = 0;
      render();
      return;
    }
    if (!VIEWS.has(target)) return;

    const below = navigationStack[navigationStack.length - 2];

    if (ROOT_TABS.includes(target) && below && below.view === target) {
      triggerBack();
      return;
    }

    const fromRoot = ROOT_TABS.includes(view);
    const toRoot   = ROOT_TABS.includes(target);

    let type, dir = 1;
    if (fromRoot && toRoot) {
      type = 'tab';
      dir = TAB_INDEX[target] > TAB_INDEX[view] ? 1 : -1;
    } else if (toRoot) {
      type = 'pop';
    } else {
      type = 'push';
    }

    captureScroll();

    const entry = {
      id: ++navSeq,
      view: target,
      data,
      scroll: ROOT_TABS.includes(target) ? (tabScroll[target] || 0) : 0
    };
    const state = { id: entry.id, view: entry.view, data };

    const replace = type === 'tab' && below && ROOT_TABS.includes(below.view);

    if (replace) {
      history.replaceState(state, '', '#' + target);
      navigationStack[navigationStack.length - 1] = entry;
    } else {
      history.pushState(state, '', '#' + target);
      navigationStack.push(entry);
    }

    commitNavigation(entry, { type, dir });
  }

  function triggerBack(fromSwipe = false) {
    if (!fromSwipe && navLock) return;
    if (navigationStack.length < 2) return;
    popIntent = { fromSwipe };
    navLock = true;
    history.back();
  }
  const goBack = () => triggerBack();

  async function handlePop(state, fromSwipe = false) {
    const valid = state && VIEWS.has(state.view);
    const targetView = valid ? state.view : 'dashboard';
    const targetId   = valid ? state.id : -1;

    const leaving = navigationStack[navigationStack.length - 1];
    captureScroll();

    const idx = navigationStack.findIndex(en => en.id === targetId);
    let entry;
    if (idx !== -1) {
      navigationStack = navigationStack.slice(0, idx + 1);
      entry = navigationStack[idx];
    } else {
      entry = { id: targetId, view: targetView, data: (valid && state.data) || null,
                scroll: ROOT_TABS.includes(targetView) ? (tabScroll[targetView] || 0) : 0 };
      navigationStack.push(entry);
    }

    const goingBack = leaving ? entry.id < leaving.id : true;
    let type = goingBack ? 'pop' : 'push';
    let dir = 1;
    if (leaving && ROOT_TABS.includes(targetView) && ROOT_TABS.includes(leaving.view)) {
      type = 'tab';
      dir = Math.sign(TAB_INDEX[targetView] - TAB_INDEX[leaving.view]) || 1;
    }

    await commitNavigation(entry, { type, dir, fromSwipe });
  }

  function onPopState(e) {
    if (popIntent) {
      const { fromSwipe } = popIntent;
      popIntent = null;
      navLock = false;
      handlePop(e.state, fromSwipe);
      return;
    }
    if (navLock) { pendingPop = e.state; return; }
    handlePop(e.state, false);
  }

  function processPending() {
    if (pendingPop !== null && !navLock) {
      const s = pendingPop; pendingPop = null;
      handlePop(s, false);
    }
  }

  /* Edge swipe-to-back gesture */
  let swipe = null;

  document.addEventListener('touchstart', e => {
    if (navLock || swipe || navigationStack.length < 2) return;
    const t = e.changedTouches[0];
    if (t.clientX > NAV_CONFIG.EDGE) return;
    swipe = { x0: t.clientX, y0: t.clientY, armed: false, dx: 0,
              w: window.innerWidth, pts: [{ x: t.clientX, t: performance.now() }] };
  }, { passive: true, capture: true });

  document.addEventListener('touchmove', e => {
    if (!swipe) return;
    const t  = e.changedTouches[0];
    const dx = t.clientX - swipe.x0;
    const dy = t.clientY - swipe.y0;

    if (!swipe.armed) {
      if (Math.abs(dx) < NAV_CONFIG.ARM && Math.abs(dy) < NAV_CONFIG.ARM) return;
      if (dx <= 0 || Math.abs(dx) <= Math.abs(dy)) { swipe = null; return; }
      armSwipe();
    }

    e.preventDefault();

    swipe.dx = Math.min(Math.max(dx, 0), swipe.w);
    swipe.pts.push({ x: t.clientX, t: performance.now() });
    if (swipe.pts.length > 8) swipe.pts.shift();

    const p = swipe.dx / swipe.w;
    setX($current,  swipe.dx + 'px');
    setX($incoming, `${-NAV_CONFIG.PARALLAX + NAV_CONFIG.PARALLAX * p}%`);
    $incoming._dim.style.opacity = (NAV_CONFIG.DIM * (1 - p)).toFixed(3);
  }, { passive: false, capture: true });

  document.addEventListener('touchend', () => {
    if (!swipe) return;
    const s = swipe; swipe = null;
    if (!s.armed) return;

    const pts = s.pts.slice(-4);
    let vx = 0;
    if (pts.length >= 2) {
      const dt = pts[pts.length - 1].t - pts[0].t;
      if (dt > 0) vx = (pts[pts.length - 1].x - pts[0].x) / dt;
    }

    if (s.dx > s.w * NAV_CONFIG.COMMIT || vx > NAV_CONFIG.VELOCITY) {
      triggerBack(true);
    } else {
      cancelSwipe();
    }
  });

  document.addEventListener('touchcancel', () => {
    if (swipe && swipe.armed) cancelSwipe();
    swipe = null;
  });

  function armSwipe() {
    swipe.armed = true;
    navLock = true;
    const prev = navigationStack[navigationStack.length - 2];

    renderView(prev.view, $incoming._scroll, prev.data);
    $incoming._scroll.scrollTop = prev.scroll || 0;
    incomingView = prev.view;
    $incoming.classList.add('active');
    $current.classList.add('dragging');
    $incoming.classList.add('dragging');
    $current.style.zIndex = 2;
    $incoming.style.zIndex = 1;
    setX($incoming, `-${NAV_CONFIG.PARALLAX}%`);
    $incoming._dim.style.opacity = NAV_CONFIG.DIM;
    $('#viewport')?.classList.add('animating');
  }

  function cancelSwipe() {
    const fromEl = $current, toEl = $incoming;
    const dur = 240;

    for (const el of [fromEl, toEl]) {
      el.classList.remove('dragging');
      el.classList.add('animating');
      el.style.transitionDuration = dur + 'ms';
    }
    toEl._dim.style.transitionDuration = dur + 'ms';

    setX(fromEl, '0px');
    setX(toEl, `-${NAV_CONFIG.PARALLAX}%`);
    toEl._dim.style.opacity = NAV_CONFIG.DIM;

    let done = false;
    const finish = () => {
      if (done) return; done = true;
      clearTimeout(timer);
      fromEl.removeEventListener('transitionend', onEnd);
      for (const el of [fromEl, toEl]) {
        el.classList.remove('animating', 'dragging');
        el.style.transitionDuration = '';
        el.style.zIndex = '';
        setX(el, '0%');
        el._dim.style.opacity = 0;
        el._dim.style.transitionDuration = '';
      }
      toEl.classList.remove('active');
      toEl._scroll.innerHTML = '';
      incomingView = null;
      $('#viewport')?.classList.remove('animating');
      navLock = false;
      processPending();
    };
    const onEnd = e => { if (e.target === fromEl && e.propertyName === 'transform') finish(); };
    fromEl.addEventListener('transitionend', onEnd);
    const timer = setTimeout(finish, dur + 100);
  }

  function updateChrome() {
    window.currentActiveView = view;
    $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
    if (TITLES[view]) {
      $("#viewTitle").textContent = TITLES[view][0];
      $("#viewSub").textContent = TITLES[view][1];
    }
    $("#sidebar")?.classList.remove("open");
    $("#scrim")?.classList.remove("show");
    renderBottom();
  }

  function updateBottomNavIndicator() {
    const nav = document.getElementById("bottomNav");
    if (!nav) return;
    const activeBtn = nav.querySelector("button.on");
    const indicator = document.getElementById("bottomNavIndicator");
    if (activeBtn && indicator) {
      const rect = activeBtn.getBoundingClientRect();
      const parentRect = nav.querySelector(".bottom-nav-track")?.getBoundingClientRect() || nav.getBoundingClientRect();
      const left = rect.left - parentRect.left;
      indicator.style.transform = `translate3d(${left.toFixed(1)}px, 0, 0)`;
      indicator.style.width = `${rect.width.toFixed(1)}px`;
    }
  }

  function renderBottom() {
    const items = [
      ["dashboard","dash","Home"],
      ["workout","session","Train"],
      ["routine","routine","Routine"],
      ["progress","prog","Stats"],
      ["body","body","Body"]
    ];
    const buttonsHTML = items.map(([v,i,l])=>`<button data-view="${v}" class="${view===v?"on":""}">${svgIcon(i)}<span>${l}</span></button>`).join("");
    $("#bottomNav").innerHTML = `
      <div class="bottom-nav-track">
        <div class="bottom-nav-indicator" id="bottomNavIndicator"></div>
        ${buttonsHTML}
      </div>
    `;
    requestAnimationFrame(updateBottomNavIndicator);
  }

  window.addEventListener("resize", updateBottomNavIndicator, { passive: true });

  function initNav() {
    $current  = $("#view-current");
    $incoming = $("#view-incoming");
    if (!$current || !$incoming) return;
    for (const el of [$current, $incoming]) {
      el._scroll = el.querySelector('.view-scroll');
      el._dim    = el.querySelector('.view-dim');
    }

    history.scrollRestoration = 'manual';

    let st = history.state;
    if (!st || !VIEWS.has(st.view)) {
      st = { id: ++navSeq, view: (S.active ? "workout" : "dashboard") };
      history.replaceState(st, '', '#' + st.view);
    }
    navSeq = Math.max(navSeq, st.id || 0);

    navigationStack = [{ id: st.id, view: st.view, data: null, scroll: 0 }];
    view = st.view;
    renderView(view, $current._scroll);
    $current.classList.add('active');
    updateChrome();

    window.addEventListener("popstate", onPopState);
    document.addEventListener("keydown", e => { if (e.key === "Escape") goBack(); });
  }

  /* ---------- views ---------- */
  function render(c = ($current ? $current._scroll : null), data = null) {
    $("#avatar").textContent = (S.profile.name||"A").slice(0,1).toUpperCase();
    $("#sideName").textContent = S.profile.name || "Athlete";
    $("#sideGoal").textContent = S.profile.goal || "Forge the physique";
    renderBottom();
    if (!c) c = $current ? $current._scroll : null;
    const map = {dashboard:viewDash, workout:viewWorkout, history:viewHistory, progress:viewProgress, routine:viewRoutine, exercises:viewLib, body:viewBody, settings:viewSettings};
    if (c) {
      c.innerHTML = (map[view]||viewDash)();
      bindView(c);
      if (window.forgeJuice?.decorate) window.forgeJuice.decorate(c);
    }
  }

  function viewDash() {
    const plan = plannedToday();
    const doneToday = workoutsOn(todayISO());
    const isRest = !plan.items.length;
    const st = streak();
    const wv = weekVolume(0);
    const pv = weekVolume(1);
    const dv = pv ? Math.round(((wv-pv)/pv)*100) : 0;
    const lastBw = S.body.length ? S.body[S.body.length-1] : null;
    const heat = heatmapHTML();
    const upcoming = nextDaysHTML();
    const recent = [...S.workouts].filter(w=>w.status==="done").sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
    const prs = recentPRs(5);
    const heroCTA = S.active
      ? `<button class="btn primary lg" data-act="resume">Resume session · ${esc(S.active.name)}</button>`
      : isRest
        ? `<button class="btn primary lg" data-act="start-any">Start an extra session</button>`
        : `<button class="btn primary lg" data-act="start-today">Start ${esc(plan.name)}</button>`;

    return `
      <div class="grid g-2">
        <div class="card hero">
          <div class="hero-kicker">${esc(fmtDateLong(todayISO()))}</div>
          <h2>${S.active ? "Session in progress" : isRest ? "Recovery day" : esc(plan.name)}</h2>
          <p>${S.active ? "You have an unfinished workout. Pick up the bar where you left it." :
              isRest ? "Mobility, walk, sleep. Or steal a session if you feel like iron." :
              `${plan.items.length} lifts programmed · last time this slot ${lastAgo(plan)}`}</p>
          <div class="hero-actions">
            ${heroCTA}
            ${!isRest && !S.active ? `<button class="btn lg" data-act="preview-today">Preview</button>`:""}
            <button class="btn lg ghost" data-act="open-tools">Calculators</button>
          </div>
        </div>
        <div class="grid" style="gap:14px">
          <div class="grid g-2">
            ${statCard("Streak", st+"d", st? "Keep showing up." : "Train today to start one.", st>=3?"up":"flat", st>=3?"HOT":"")}
            ${statCard("Week volume", trimNum(toDisplay(wv)), u()+" moved", dv>0?"up":dv<0?"down":"flat", (dv>0?"+":"")+dv+"%")}
            ${statCard("Sessions", sessionsThisWeek(), "this week", "flat", weeklyGoal())}
            ${statCard("Bodyweight", lastBw? trimNum(toDisplay(lastBw.w))+" "+u() : "—", lastBw? fmtDate(lastBw.d):"log in Body", "flat", "")}
          </div>
        </div>
      </div>

      <div class="grid g-3" style="margin-top:14px">
        <div class="card" style="grid-column: span 2;">
          <div class="section-head" style="margin-top:0"><h3>This week's map</h3><span class="pill">starts ${DAYS[S.profile.weekStarts||1].slice(0,3)}</span></div>
          ${upcoming}
        </div>
        <div class="card">
          <div class="section-head" style="margin-top:0"><h3>Consistency</h3><span class="pill lime">${trainedDays(16*7)} sessions / 16w</span></div>
          <div style="display:flex;gap:10px;align-items:center">
            <div class="heat">${heat}</div>
          </div>
          <div style="display:flex;gap:6px;margin-top:12px;align-items:center;font-size:11px;color:var(--muted)">
            Less <i style="width:10px;height:10px;border-radius:2px;background:rgba(255,255,255,.06);display:inline-block"></i>
            <i style="width:10px;height:10px;border-radius:2px;background:rgba(214,255,63,.22);display:inline-block"></i>
            <i style="width:10px;height:10px;border-radius:2px;background:rgba(214,255,63,.68);display:inline-block"></i>
            <i style="width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block"></i> More
          </div>
        </div>
      </div>

      <div class="grid g-2" style="margin-top:14px">
        <div class="card">
          <div class="section-head" style="margin-top:0"><h3>Recent sessions</h3><button class="btn sm" data-go="history">All</button></div>
          <div class="grid" style="gap:8px">
            ${recent.length? recent.map(w=>`
              <div class="hist-row" data-open-wo="${w.id}">
                <div class="muscle-dot" style="background:var(--accent)"></div>
                <div class="ex-meta">
                  <b>${esc(w.name)}</b>
                  <span>${fmtDate(w.date)} · ${workingSets(w)} sets · ${trimNum(toDisplay(volumeOf(w)))} ${u()} vol</span>
                </div>
                <span class="pill">${Math.round((w.duration||0)/60)}m</span>
              </div>`).join("") : `<div class="empty">No sessions yet. Start one.</div>`}
          </div>
        </div>
        <div class="card">
          <div class="section-head" style="margin-top:0"><h3>Personal records</h3></div>
          <div class="grid" style="gap:8px">
            ${prs.length? prs.map(p=>`
              <div class="ex-row" data-go-ex="${p.id}">
                <div class="muscle-dot" style="background:${MUSCLE_COLOR[p.muscle]||"#fff"}"></div>
                <div class="ex-meta"><b>${esc(p.name)}</b><span>${p.line}</span></div>
                <span class="pill lime">PR</span>
              </div>`).join("") : `<div class="empty">PRs appear after completed working sets.</div>`}
          </div>
        </div>
      </div>`;
  }
  function statCard(k,v,s,kind,delta) {
    return `<div class="card stat"><h3>${esc(k)}</h3><div class="val">${v}</div><div class="sub" style="display:flex;justify-content:space-between;align-items:center"><span>${esc(s)}</span>${delta!==""?`<span class="delta ${kind}">${delta}</span>`:""}</div></div>`;
  }
  function weeklyGoal() {
    const planned = Object.values(S.routine.days||{}).filter(d=>d.items && d.items.length).length;
    return planned? `${sessionsThisWeek()}/${planned}` : "";
  }
  function lastAgo(plan) {
    const ids = new Set(plan.items.map(i=>i.exerciseId));
    const w = [...S.workouts].filter(x=>x.status==="done" && x.exercises.some(e=>ids.has(e.exerciseId))).sort((a,b)=>b.date.localeCompare(a.date))[0];
    return w ? fmtDate(w.date) : "not yet";
  }
  function trainedDays(n) {
    const set = new Set(S.workouts.filter(w=>w.status==="done").map(w=>w.date));
    let c=0; const d=new Date();
    for(let i=0;i<n;i++){ if(set.has(todayISO(d))) c++; d.setDate(d.getDate()-1); }
    return c;
  }
  function heatmapHTML() {
    const set = {};
    for (const w of S.workouts.filter(x=>x.status==="done")) set[w.date]=(set[w.date]||0)+1;
    const cells = [];
    const end = new Date();
    const start = new Date(); start.setDate(end.getDate() - (16*7-1) - ((end.getDay() - (S.profile.weekStarts||1) + 7)%7));
    // align to week start then 16 weeks
    const aligned = new Date(end);
    const back = 16*7 - 1;
    aligned.setDate(end.getDate()-back);
    // pad to week start
    while (((aligned.getDay()-(S.profile.weekStarts||1)+7)%7)!==0) aligned.setDate(aligned.getDate()-1);
    const cursor = new Date(aligned);
    const last = new Date(end);
    while (cursor<=last) {
      const iso = todayISO(cursor);
      const n = set[iso]||0;
      const lvl = n===0?"": n===1?"l1":n===2?"l2":n===3?"l3":"l4";
      cells.push(`<i class="${lvl} ${iso===todayISO()?"today":""}" title="${iso} · ${n} session(s)"></i>`);
      cursor.setDate(cursor.getDate()+1);
    }
    return cells.join("");
  }
  function nextDaysHTML() {
    const start = S.profile.weekStarts ?? 1;
    const now = new Date();
    const offset = (now.getDay()-start+7)%7;
    const monday = new Date(now); monday.setDate(now.getDate()-offset);
    let html = `<div class="cal">`;
    for (let i=0;i<7;i++) html += `<div class="lab">${DAYS_S[(start+i)%7]}</div>`;
    for (let i=0;i<7;i++) {
      const d = new Date(monday); d.setDate(monday.getDate()+i);
      const iso = todayISO(d);
      const plan = S.routine.days[d.getDay()] || {name:"Rest", items:[]};
      const done = workoutsOn(iso).length>0;
      html += `<div class="d ${done?"done":""} ${iso===todayISO()?"today":""}" data-day-iso="${iso}" title="${esc(plan.name)}">
        <b>${d.getDate()}</b><span style="font-size:9px;margin-top:2px">${esc(plan.name.slice(0,8))}</span>
      </div>`;
    }
    html += `</div>`;
    return html;
  }
  function recentPRs(n) {
    const out = [];
    for (const ex of allEx()) {
      const p = prsFor(ex.id);
      if (p.bestW>0) out.push({id:ex.id,name:ex.name,muscle:ex.muscle, line:`${trimNum(toDisplay(p.bestW))} ${u()} · e1RM ${trimNum(toDisplay(p.bestE))}`, bestE:p.bestE});
    }
    out.sort((a,b)=>b.bestE-a.bestE);
    return out.slice(0,n);
  }

  /* workout */
  function makeSession(dayIndex, date=todayISO()) {
    const plan = S.routine.days[dayIndex] || {name:"Custom", items:[]};
    const wo = {
      id: uid(), date, name: plan.name || "Session", status:"active",
      started: Date.now(), ended:null, duration:0,
      feel:5, energy:5, soreness:3, sleep:7, note:"",
      exercises: plan.items.map(it => blockFromPlan(it, date))
    };
    return wo;
  }
  function blockFromPlan(it, date) {
    const last = lastSessionFor(it.exerciseId, date);
    const sets = [];
    const n = Number(it.sets)||3;
    const prevSets = last ? last.block.sets.filter(s=>s.type!=="warmup") : [];
    for (let i=0;i<n;i++) {
      const p = prevSets[i] || prevSets[prevSets.length-1];
      sets.push({ id:uid(), type:"working", w: p? p.w : 0, r: p? p.r : parseReps(it.reps), rpe: p? p.rpe : 7.5, done:false });
    }
    return { id:uid(), exerciseId:it.exerciseId, targetSets:it.sets, targetReps:it.reps, rest:it.rest||S.profile.defaultRest, note:it.note||"", sets };
  }
  function parseReps(s) {
    if (!s) return 8;
    const m = String(s).match(/(\d+)/);
    return m? Number(m[1]) : 8;
  }
  function ensureTick() {
    if (tick) return;
    tick = setInterval(() => {
      if (S.active && view==="workout") {
        const el = $("#liveClock");
        if (el) el.textContent = fmtDur(Date.now()-S.active.started);
      }
      if (rest.on) {
        const now = Date.now();
        const newLeft = Math.max(0, Math.ceil((rest.endTime - now) / 1000));
        if (now >= rest.endTime || newLeft <= 0) {
          stopRest(true);
        } else if (newLeft !== rest.left) {
          rest.left = newLeft;
          updateRestUI();
        }
      }
    }, 250);
  }
  function fmtDur(ms) {
    const s = Math.max(0, Math.floor(ms/1000));
    const h = Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
    return h? `${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}` : `${m}:${String(ss).padStart(2,"0")}`;
  }

  function viewWorkout() {
    if (!S.active) return emptySession();
    const wo = S.active;
    const doneSets = wo.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
    const totSets = wo.exercises.reduce((a,e)=>a+e.sets.length,0);
    const vol = volumeOf({...wo, exercises: wo.exercises.map(e=>({...e, sets:e.sets.map(s=>({...s, done:true}))})) });
    const doneVol = volumeOf(wo);
    return `
      <div class="wo-head">
        <div>
          <div class="pill lime">${esc(wo.name)}</div>
          <h2 style="font-size:26px;letter-spacing:-.04em;margin:8px 0 4px">${esc(fmtDateLong(wo.date))}</h2>
          <div style="color:var(--muted);font-size:13px">${doneSets}/${totSets} sets · ${trimNum(toDisplay(doneVol))} ${u()} logged</div>
        </div>
        <div style="text-align:right">
          <div class="timer-live" id="liveClock">${fmtDur(Date.now()-wo.started)}</div>
          <div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end">
            <button class="btn sm" data-act="add-ex">+ Exercise</button>
            <button class="btn sm danger" data-act="cancel-wo">Discard</button>
            <button class="btn sm primary" data-act="finish-wo">Finish</button>
          </div>
        </div>
      </div>
      <div class="prog" style="margin-bottom:14px"><i style="width:${totSets? (doneSets/totSets*100):0}%"></i></div>
      <div class="grid" style="gap:12px">
        ${wo.exercises.map((b,idx)=>exCard(b,idx)).join("")}

      <div class="card" style="margin-top:14px">
        <div class="field"><label>Session notes</label>
          <textarea class="inp" id="woNote" placeholder="Sleep, pain, pumps, what felt strong...">${esc(wo.note||"")}</textarea>
        </div>
      </div>`;
  }
  function emptySession() {
    const plan = plannedToday();
    const days = Object.entries(S.routine.days||{}).map(([k,v])=>({k:+k,...v}));
    return `
      <div class="card hero">
        <div class="hero-kicker">No live session</div>
        <h2>${plan.items.length? esc(plan.name)+" is programmed":"Nothing programmed today"}</h2>
        <p>Start today's plan, pick another day from the split, or build a quick empty session and add lifts on the fly.</p>
        <div class="hero-actions">
          ${plan.items.length? `<button class="btn primary lg" data-act="start-today">Start ${esc(plan.name)}</button>`:""}
          <button class="btn lg" data-act="start-empty">Empty session</button>
        </div>
      </div>
      <div class="section-head"><h3>Start a programmed day</h3></div>
      <div class="grid g-3">
        ${days.map(d=>`
          <div class="card" style="cursor:pointer" data-start-day="${d.k}">
            <div class="pill ${d.items.length?"lime":""}">${DAYS[d.k]}</div>
            <h3 style="color:var(--text);font-size:18px;margin:10px 0 6px">${esc(d.name)}</h3>
            <div style="color:var(--muted);font-size:12px">${d.items.length? d.items.map(i=>getEx(i.exerciseId).name).slice(0,3).join(" · ")+(d.items.length>3?"…":""):"Rest / empty"}</div>
          </div>`).join("")}
      </div>`;
  }
  function exCard(b, idx) {
    const ex = getEx(b.exerciseId);
    const last = lastSessionFor(b.exerciseId, S.active.date);
    const open = ui.expand[b.id] !== false;
    const done = b.sets.length && b.sets.every(s=>s.done);
    const hint = overloadHint(b, last);

    const unloggedSets = b.sets.filter(s => !s.done && (!s.w || s.w === 0) && (!s.r || s.r === 0));
    const isAllDone = b.sets.length > 0 && b.sets.every(s => s.done);
    let heroSubText = "";
    if (last && last.block && last.block.sets && last.block.sets.length) {
      const weights = last.block.sets.map(s => toDisplay(s.w)).filter(w => w > 0);
      const lo = weights.length ? Math.min(...weights) : 0;
      const hi = weights.length ? Math.max(...weights) : 0;
      const rangeStr = lo > 0 ? (lo !== hi ? `${trimNum(lo)}–${trimNum(hi)} ${u()}` : `${trimNum(lo)} ${u()}`) : "";
      if (unloggedSets.length > 0) {
        heroSubText = `${rangeStr} · fills ${unloggedSets.length} open set${unloggedSets.length > 1 ? 's' : ''}`;
      } else if (isAllDone) {
        heroSubText = `${b.sets.length}/${b.sets.length} sets completed · tap ✓ to edit`;
      } else {
        heroSubText = `${rangeStr} · tap to copy last session values`;
      }
    } else {
      heroSubText = "First logged session — tap +Set or enter weight";
    }

    const heroCopyHtml = `
      <button class="hero-copy-btn ${isAllDone ? 'is-complete' : ''}" data-same-last="${b.id}" ${isAllDone ? 'disabled' : ''}>
        <span class="hero-copy-title">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>
          ${isAllDone ? 'SESSION LOGGED' : 'COPY LAST SESSION'}
        </span>
        <span class="hero-copy-sub">${heroSubText}</span>
      </button>`;

    return `
      <div class="card ex-card ${open?"open":""}" data-excard="${b.id}">
        <div class="ex-card-h" data-toggle-ex="${b.id}">
          <div class="muscle-dot" style="background:${MUSCLE_COLOR[ex.muscle]}"></div>
          <div class="ex-meta">
            <b>${idx+1}. ${esc(ex.name)}</b>
            <span>${esc(ex.muscle)} · target ${esc(b.targetSets||"—")} × ${esc(b.targetReps||"—")} · rest ${b.rest||90}s
              ${last?` · last ${fmtDate(last.workout.date)}`:""}</span>
          </div>
          ${done? `<span class="pill lime">Done</span>`:`<span class="pill">${b.sets.filter(s=>s.done).length}/${b.sets.length}</span>`}
          <svg class="ex-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="ex-card-body-wrap">
          <div class="ex-card-b">
            ${hint? `<div style="font-size:12px;color:var(--accent);margin:0 4px 10px">${esc(hint)}</div>`:""}
            <div class="set-list">
              ${b.sets.map((s,si)=>setRow(b,s,si,last)).join("")}
            </div>
            <div class="ex-card-actions">
              <button class="btn sm" data-add-set="${b.id}" data-type="working">+ Set</button>
              <button class="btn sm" data-add-set="${b.id}" data-type="warmup">+ Warm-up</button>
              <button class="btn sm" data-warmup-gen="${b.id}">Warm-up ladder</button>
              <button class="btn sm" data-ex-note="${b.id}">Note</button>
              <button class="btn sm danger" data-rm-ex="${b.id}">Remove</button>
            </div>
            ${heroCopyHtml}
            ${b.note? `<div style="margin-top:8px;font-size:12px;color:var(--muted)">${esc(b.note)}</div>`:""}
          </div>
        </div>
      </div>`;
  }

  // Inline Plate Calculator Portal System
  let activePlateState = null; // { bid, sid, btnEl }
  let platePopoverEl = null;

  function ensurePlatePopover() {
    if (platePopoverEl) return platePopoverEl;
    platePopoverEl = document.createElement("div");
    platePopoverEl.id = "platePopover";
    platePopoverEl.className = "plate-popover";
    document.body.appendChild(platePopoverEl);
    return platePopoverEl;
  }

  function togglePlatePopover(bid, sid, btnEl) {
    const pop = ensurePlatePopover();
    if (activePlateState && activePlateState.bid === bid && activePlateState.sid === sid) {
      closePlatePopover();
      return;
    }
    if (activePlateState && activePlateState.btnEl) {
      activePlateState.btnEl.classList.remove("active");
    }
    activePlateState = { bid, sid, btnEl };
    btnEl.classList.add("active");
    updatePlatePopover();
    pop.classList.add("open");
  }

  function closePlatePopover() {
    if (!activePlateState) return;
    if (activePlateState.btnEl) {
      activePlateState.btnEl.classList.remove("active");
    }
    if (platePopoverEl) {
      platePopoverEl.classList.remove("open");
    }
    activePlateState = null;
  }

  function updatePlatePopover() {
    if (!activePlateState || !platePopoverEl) return;
    const { bid, sid, btnEl } = activePlateState;
    if (!document.body.contains(btnEl)) {
      closePlatePopover();
      return;
    }

    const inp = document.querySelector(`input[data-setv="${bid}:${sid}:w"]`);
    let target = inp ? parseFloat(inp.value) : 0;
    if (isNaN(target)) target = 0;

    const bar = toDisplay(S.profile.bar || 20);
    const uStr = u();
    const colors = {
      25: "#e11d48", 20: "#2563eb", 15: "#eab308", 10: "#16a34a", 5: "#ef4444", 2.5: "#f3f4f6", 1.25: "#94a3b8",
      45: "#2563eb", 35: "#eab308"
    };

    const per = (target - bar) / 2;
    let bodyHtml = "";

    const avail = unit() === "kg" ? [25, 20, 15, 10, 5, 2.5, 1.25] : [45, 35, 25, 10, 5, 2.5];
    const railChipsHtml = avail.map(p => {
      const bg = colors[p] || "#94a3b8";
      const textColor = (p === 2.5 || p === 1.25 || p === 15 || p === 35) ? "#0f172a" : "#ffffff";
      return `<button class="plate-chip-btn" data-add-plate="${p}" style="background:${bg};color:${textColor}">+${p}</button>`;
    }).join("");

    const railSection = `
      <div class="plate-rail-wrap">
        <div class="plate-rail-title">
          <span>TAP PLATE TO ADD (+2×)</span>
          <button data-clear-plates style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);color:var(--muted);font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;cursor:pointer">CLEAR</button>
        </div>
        <div class="plate-rail-chips">
          ${railChipsHtml}
        </div>
      </div>`;

    const hdrHtml = `
      <div class="plate-popover-hdr">
        <span class="plate-popover-title">🏋️ Plate Calc</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="plate-popover-weight">${trimNum(target)} ${uStr}</span>
          <button data-close-plate-popover style="background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:4px" aria-label="Close plate calculator">✕</button>
        </div>
      </div>`;

    if (per < -0.01) {
      bodyHtml = `
        ${hdrHtml}
        <div class="plate-math-summary" style="padding:6px 0">
          <div style="color:#f87171;font-weight:600;font-size:12px">Below bar weight (${trimNum(bar)} ${uStr})</div>
        </div>
        ${railSection}`;
    } else if (Math.abs(per) < 0.01) {
      bodyHtml = `
        ${hdrHtml}
        <div class="plate-popover-barbell">
          <div class="plate-collar"></div>
          <div class="plate-bar-center"></div>
          <div class="plate-collar"></div>
        </div>
        <div class="plate-math-summary">
          <div class="plate-math-side">Empty Bar (${trimNum(bar)} ${uStr})</div>
          <div class="plate-math-full">No plates required</div>
        </div>
        ${railSection}`;
    } else {
      let left = per, used = [];
      for (const p of avail) {
        while (left + 1e-5 >= p) {
          used.push(p);
          left -= p;
        }
      }
      const remainder = left > 0.05 ? Math.round(left * 100) / 100 : 0;

      const platesHtml = used.map(p => {
        const bg = colors[p] || "#94a3b8";
        const textColor = (p === 2.5 || p === 1.25 || p === 15 || p === 35) ? "#0f172a" : "#ffffff";
        return `<span class="plate-badge" data-unplate="${p}" style="background:${bg};color:${textColor};cursor:pointer" title="Tap to unload">${p}</span>`;
      }).join("");

      const revPlatesHtml = [...used].reverse().map(p => {
        const bg = colors[p] || "#94a3b8";
        const textColor = (p === 2.5 || p === 1.25 || p === 15 || p === 35) ? "#0f172a" : "#ffffff";
        return `<span class="plate-badge" data-unplate="${p}" style="background:${bg};color:${textColor};cursor:pointer" title="Tap to unload">${p}</span>`;
      }).join("");

      const remHtml = remainder > 0 ? `<span class="plate-badge plate-micro" title="Micro-plate">+${remainder}</span>` : "";

      const sideEquation = used.length ? used.join(" + ") + (remainder > 0 ? ` + ${remainder}` : "") : `${remainder} ${uStr}`;
      const sideTotal = trimNum(per);

      bodyHtml = `
        ${hdrHtml}
        <div class="plate-popover-barbell">
          <div class="plate-collar"></div>
          ${revPlatesHtml}
          <div class="plate-bar-center"></div>
          ${platesHtml}
          ${remHtml}
          <div class="plate-collar"></div>
        </div>
        <div class="plate-math-summary">
          <div class="plate-math-side">Per side: ${sideEquation}</div>
          <div class="plate-math-full">Bar (${trimNum(bar)}) + 2×(${sideTotal}) = ${trimNum(target)} ${uStr}</div>
        </div>
        ${railSection}`;
    }

    platePopoverEl.innerHTML = bodyHtml;

    platePopoverEl.onclick = (e) => {
      if (e.target.closest("[data-close-plate-popover]")) {
        closePlatePopover();
        return;
      }

      if (e.target.closest("[data-clear-plates]") && activePlateState) {
        const { bid, sid } = activePlateState;
        writeSet(`${bid}:${sid}:w`, 0);
        const inp = document.querySelector(`input[data-setv="${bid}:${sid}:w"]`);
        if (inp) inp.value = "";
        updatePlatePopover();
        return;
      }

      const addBtn = e.target.closest("[data-add-plate]");
      const unplateBtn = e.target.closest("[data-unplate]");

      if (addBtn && activePlateState) {
        const p = parseFloat(addBtn.dataset.addPlate);
        const { bid, sid } = activePlateState;
        const inp = document.querySelector(`input[data-setv="${bid}:${sid}:w"]`);
        let cur = inp ? parseFloat(inp.value) : 0;
        if (isNaN(cur)) cur = 0;

        let next = (cur <= 0 || cur < bar) ? bar + p * 2 : cur + p * 2;
        writeSet(`${bid}:${sid}:w`, next);
        if (inp) inp.value = trimNum(next);
        updatePlatePopover();
      }

      if (unplateBtn && activePlateState) {
        const p = parseFloat(unplateBtn.dataset.unplate);
        const { bid, sid } = activePlateState;
        const inp = document.querySelector(`input[data-setv="${bid}:${sid}:w"]`);
        let cur = inp ? parseFloat(inp.value) : 0;
        if (isNaN(cur)) cur = 0;

        let next = Math.max(bar, Math.round((cur - p * 2) * 100) / 100);
        writeSet(`${bid}:${sid}:w`, next);
        if (inp) inp.value = next > 0 ? trimNum(next) : "";
        updatePlatePopover();
      }
    };

    const rect = btnEl.getBoundingClientRect();
    const popWidth = platePopoverEl.offsetWidth || 290;
    const popHeight = platePopoverEl.offsetHeight || 160;

    let top = rect.bottom + 8;
    if (top + popHeight > window.innerHeight - 10) {
      top = Math.max(10, rect.top - popHeight - 8);
    }

    let left = rect.left + (rect.width / 2) - (popWidth / 2);
    left = Math.max(12, Math.min(window.innerWidth - popWidth - 12, left));

    platePopoverEl.style.top = `${top}px`;
    platePopoverEl.style.left = `${left}px`;
  }

  document.addEventListener("pointerdown", e => {
    if (!activePlateState) return;
    if (e.target.closest("[data-plate-calc]") || e.target.closest("#platePopover")) return;
    closePlatePopover();
  }, true);

  window.addEventListener("scroll", () => {
    if (activePlateState) closePlatePopover();
  }, { passive: true, capture: true });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && activePlateState) closePlatePopover();
  });

  // Accelerated Hold-to-Repeat Steppers System
  let holdTimer = null;
  let holdInterval = null;

  function stopHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (holdInterval) { clearTimeout(holdInterval); holdInterval = null; }
  }

  document.addEventListener("pointerdown", e => {
    const btn = e.target.closest("[data-hold]");
    if (!btn || (e.button !== undefined && e.button !== 0)) return;
    stopHold();

    const datasetStep = btn.dataset.step;
    if (!datasetStep) return;

    const [bid, sid, field, dirStr] = datasetStep.split(":");
    const dir = +dirStr;
    let ticks = 0;
    let multiplier = 1;

    holdTimer = setTimeout(() => {
      let delay = 140;
      const tick = () => {
        ticks++;
        if (ticks % 8 === 0) multiplier = Math.min(4, multiplier * 2);
        if (ticks % 6 === 0) delay = Math.max(50, delay - 25);

        stepSet(bid, sid, field, dir, multiplier);
        holdInterval = setTimeout(tick, delay);
      };
      tick();
    }, 380);
  });

  ["pointerup", "pointercancel", "pointerleave"].forEach(evt => {
    document.addEventListener(evt, stopHold);
  });

  // Keypad Bottom Sheet System
  let keypadActiveTarget = null; // { bid, sid, field }
  let keypadValueStr = "";
  let keypadSheetEl = null;
  let keypadBackdropEl = null;

  function ensureKeypadSheet() {
    if (keypadSheetEl) return;
    
    keypadBackdropEl = document.createElement("div");
    keypadBackdropEl.className = "keypad-backdrop";
    keypadBackdropEl.onclick = closeKeypadSheet;
    document.body.appendChild(keypadBackdropEl);

    keypadSheetEl = document.createElement("div");
    keypadSheetEl.className = "keypad-sheet";
    keypadSheetEl.setAttribute("role", "dialog");
    document.body.appendChild(keypadSheetEl);
  }

  function openKeypadSheet(bid, sid, field = "w") {
    ensureKeypadSheet();
    keypadActiveTarget = { bid, sid, field };

    const { s } = findSet(bid, sid);
    if (field === "w") {
      const curW = s && s.w ? toDisplay(s.w) : 0;
      keypadValueStr = curW ? String(curW) : "";
    } else {
      const curR = s && s.r ? s.r : 0;
      keypadValueStr = curR ? String(curR) : "";
    }

    renderKeypadSheet();
    keypadBackdropEl.classList.add("open");
    keypadSheetEl.classList.add("open");
  }

  function closeKeypadSheet() {
    if (keypadSheetEl) keypadSheetEl.classList.remove("open");
    if (keypadBackdropEl) keypadBackdropEl.classList.remove("open");
    keypadActiveTarget = null;
  }

  function syncKeypadToState() {
    if (!keypadActiveTarget) return;
    const { bid, sid, field } = keypadActiveTarget;
    const val = parseFloat(keypadValueStr) || 0;
    const key = `${bid}:${sid}:${field}`;

    writeSet(key, val);

    const inp = document.querySelector(`input[data-setv="${key}"]`);
    if (inp) {
      if (field === "w") inp.value = val ? trimNum(val) : "";
      else if (field === "r") inp.value = val ? String(Math.round(val)) : "";
      else if (field === "rpe") inp.value = val ? trimNum(Math.round(val * 10) / 10) : "";
    }

    if (field === "w" && activePlateState && activePlateState.bid === bid && activePlateState.sid === sid) {
      updatePlatePopover();
    }
  }

  function renderKeypadSheet() {
    if (!keypadSheetEl || !keypadActiveTarget) return;
    const { bid, sid, field } = keypadActiveTarget;
    const { b, s } = findSet(bid, sid);
    const setIdx = b ? b.sets.findIndex(x => x.id === sid) + 1 : 1;

    const isWeight = field === "w";
    const titleText = isWeight ? `SET ${setIdx} · WEIGHT (${u().toUpperCase()})` : `SET ${setIdx} · REPS`;
    const unitText = isWeight ? u() : "reps";
    const displayVal = keypadValueStr === "" ? "0" : keypadValueStr;

    let jumpsHtml = "";
    if (isWeight) {
      const jumps = unit() === "kg" ? [5, 10, 20] : [5, 10, 25];
      jumpsHtml = `
        <button class="keypad-jump-btn" data-kjump="bar">BAR</button>
        <button class="keypad-jump-btn" data-kjump="-${jumps[0]}">−${jumps[0]}</button>
        <button class="keypad-jump-btn" data-kjump="${jumps[0]}">+${jumps[0]}</button>
        <button class="keypad-jump-btn" data-kjump="${jumps[1]}">+${jumps[1]}</button>
        <button class="keypad-jump-btn" data-kjump="${jumps[2]}">+${jumps[2]}</button>`;
    } else {
      jumpsHtml = `
        <button class="keypad-jump-btn" data-kjump="set:5">5</button>
        <button class="keypad-jump-btn" data-kjump="set:8">8</button>
        <button class="keypad-jump-btn" data-kjump="set:10">10</button>
        <button class="keypad-jump-btn" data-kjump="set:12">12</button>
        <button class="keypad-jump-btn" data-kjump="set:15">15</button>`;
    }

    const dotBtnHtml = isWeight ? `<button data-kkey=".">.</button>` : `<button data-kjump="-1">−1</button>`;

    keypadSheetEl.innerHTML = `
      <div class="keypad-sheet-hdr">
        <span class="keypad-sheet-title">${titleText}</span>
        <button class="icon-btn" data-kact="close" style="width:28px;height:28px;border:none;background:transparent;color:var(--muted);cursor:pointer">✕</button>

      </div>

        ${jumpsHtml}
      </div>

        <button data-kkey="1">1</button><button data-kkey="2">2</button><button data-kkey="3">3</button>
        <button data-kkey="4">4</button><button data-kkey="5">5</button><button data-kkey="6">6</button>
        <button data-kkey="7">7</button><button data-kkey="8">8</button><button data-kkey="9">9</button>
        ${dotBtnHtml}<button data-kkey="0">0</button>
        <button data-kkey="back">⌫</button>
      </div>
      <div class="keypad-foot" style="grid-template-columns: 1fr 2fr;">
        <button class="keypad-btn-cancel" data-kact="clear">CLEAR</button>
        <button class="keypad-btn-apply" data-kact="close">DONE</button>
      </div>`;

    keypadSheetEl.onclick = (e) => {
      const btnAct = e.target.closest("[data-kact]");
      const btnKey = e.target.closest("[data-kkey]");
      const btnJump = e.target.closest("[data-kjump]");

      if (btnAct) {
        const act = btnAct.dataset.kact;
        if (act === "close") closeKeypadSheet();
        if (act === "clear") {
          keypadValueStr = "";
          syncKeypadToState();
          renderKeypadSheet();
        }
        return;
      }

      if (btnKey) {
        const k = btnKey.dataset.kkey;
        if (k === "back") keypadValueStr = keypadValueStr.slice(0, -1);
        else if (k === ".") {
          if (isWeight && !keypadValueStr.includes(".")) {
            keypadValueStr = keypadValueStr === "" ? "0." : keypadValueStr + ".";
          }
        } else {
          if (keypadValueStr.replace(".", "").length < 5) {
            keypadValueStr = keypadValueStr === "0" ? k : keypadValueStr + k;
          }
        }
        syncKeypadToState();
        renderKeypadSheet();
      }

      if (btnJump) {
        const j = btnJump.dataset.kjump;
        if (j.startsWith("set:")) {
          keypadValueStr = j.split(":")[1];
        } else if (j === "bar") {
          const barVal = toDisplay(S.profile.bar || 20);
          keypadValueStr = String(barVal);
        } else {
          const cur = parseFloat(keypadValueStr) || 0;
          keypadValueStr = String(Math.max(0, Math.round((cur + Number(j)) * 100) / 100));
        }
        syncKeypadToState();
        renderKeypadSheet();
      }
    };
  }

  function applyKeypadValue() {
    syncKeypadToState();
    closeKeypadSheet();

  document.addEventListener("keydown", e => {
    if (!keypadSheetEl || !keypadSheetEl.classList.contains("open")) return;
    if (/^[0-9]$/.test(e.key)) {
      keypadValueStr = keypadValueStr === "0" ? e.key : keypadValueStr + e.key;
      syncKeypadToState();
      renderKeypadSheet();
    } else if (e.key === ".") {
      if (keypadActiveTarget && keypadActiveTarget.field === "w" && !keypadValueStr.includes(".")) {
        keypadValueStr = keypadValueStr === "" ? "0." : keypadValueStr + ".";
        syncKeypadToState();
        renderKeypadSheet();
      }
    } else if (e.key === "Backspace") {
      keypadValueStr = keypadValueStr.slice(0, -1);
      syncKeypadToState();
      renderKeypadSheet();
    } else if (e.key === "Enter" || e.key === "Escape") {
      closeKeypadSheet();

  function overloadHint(b, last) {

    return `Last top set ${trimNum(toDisplay(top.w))} ${u()} × ${top.r}. Try ${trimNum(toDisplay(top.w))} × ${Number(top.r)+1} or ${trimNum(nextW)} ${u()}.`;

  function lastNWeeks(n) {
    const out = [];
    for (let i=n-1;i>=0;i--) {
      const now = new Date(); now.setDate(now.getDate()-i*7);
      const ws = S.profile.weekStarts??1;
      const day=(now.getDay()-ws+7)%7;
      const start=new Date(now); start.setDate(now.getDate()-day);
      const end=new Date(start); end.setDate(start.getDate()+7);
      const a=todayISO(start), b=todayISO(end);
      const wos = S.workouts.filter(w=>w.status==="done" && w.date>=a && w.date<b);
      out.push({label: `${start.getMonth()+1}/${start.getDate()}`, vol:wos.reduce((s,w)=>s+volumeOf(w),0), n:wos.length});
    }
    return out;
  }
  function muscleVolume(days) {
    const from = new Date(); from.setDate(from.getDate()-days);
    const iso = todayISO(from);
    const acc = {};
    for (const w of S.workouts.filter(x=>x.status==="done" && x.date>=iso)) {
      for (const b of w.exercises) {
        const ex = getEx(b.exerciseId);
        const vol = b.sets.filter(s=>s.done && s.type!=="warmup").reduce((a,s)=>a+(Number(s.w)||0)*(Number(s.r)||0),0);
        const ms = ex.muscles || [ex.muscle];
        ms.forEach((m,i)=> acc[m]=(acc[m]||0)+vol*(i===0?0.7:0.3/Math.max(1,ms.length-1)));
      }
    }
    return Object.entries(acc).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  }
  function topLiftId() {
    let best=null, e=0;
    for (const ex of allEx()) { const p=prsFor(ex.id); if(p.bestE>e){e=p.bestE; best=ex.id;} }
    return best;
  }
  function exerciseSeries(id) {
    if (!id) return [];
    const pts = [];
    for (const w of [...S.workouts].filter(x=>x.status==="done").sort((a,b)=>a.date.localeCompare(b.date))) {
      const b = w.exercises.find(e=>e.exerciseId===id);
      if (!b) continue;
      let best=0;
      for (const s of b.sets.filter(s=>s.done && s.type!=="warmup")) best=Math.max(best, e1rm(s.w,s.r));
      if (best) pts.push({x:w.date.slice(5), y:toDisplay(best), raw:w.date});
    }
    return pts;
  }

  /* ---------- FORGE — Native Long-Press Core Engine & Spec ---------- */

  const GESTURE = Object.freeze({
    LONG_PRESS_MS: 450,
    CHART_ENGAGE_MS: 300,
    TYPE_CYCLE_MS: 300,
    REPEAT_DELAY_MS: 350,
    REPEAT_INTERVAL_MS: 100,
    REPEAT_FAST_MS: 45,
    REPEAT_ACCEL_AFTER_MS: 1200,
    HOLD_CONFIRM_MS: 1200,
    SLOP_PX: 10,
    MAX_MENU_ITEMS_POPOVER: 5,
    SHEET_ENTER_MS: 240,
    POPOVER_ENTER_MS: 160,
  });

  let lastHapticTime = 0;
  function haptic(pattern) {
    const now = performance.now();
    if (now - lastHapticTime < 35) return;
    lastHapticTime = now;
    try {
      if (window.Haptics) {
        if (typeof pattern === "number") {
          if (pattern <= 10) (window.Haptics.selection || window.Haptics.light)?.call(window.Haptics);
          else window.Haptics.medium?.call(window.Haptics);
        } else {
          window.Haptics.heavy?.call(window.Haptics);
        }
      }
      navigator.vibrate?.(pattern);
    } catch (_) {}
  }

  const HAPTIC = {
    ACTIVATE: 15,
    TICK: 5,
    SELECT: 8,
    SUCCESS: [10, 30, 15],
    WARNING: [20, 40, 20]
  };

  // Overlays state
  let activeLpOverlayEl = null;
  let activeLpBackdropEl = null;
  let ignoreOverlayClickUntil = 0;

  function ensureLpOverlays() {
    if (activeLpBackdropEl) {
      activeLpBackdropEl.style.display = "block";
      return;
    }
    activeLpBackdropEl = document.createElement("div");
    activeLpBackdropEl.className = "forge-lp-backdrop";
    activeLpBackdropEl.style.display = "none";
    activeLpBackdropEl.onclick = (e) => {
      if (Date.now() < ignoreOverlayClickUntil) return;
      closeLpOverlay();
    };
    document.body.appendChild(activeLpBackdropEl);
  }

  function closeLpOverlay() {
    if (activeLpOverlayEl) {
      const elToRemove = activeLpOverlayEl;
      activeLpOverlayEl = null;
      elToRemove.classList.remove("open");
      setTimeout(() => {
        elToRemove.remove();
      }, 220);
    }
    if (activeLpBackdropEl) {
      activeLpBackdropEl.classList.remove("open");
      setTimeout(() => {
        if (activeLpBackdropEl && !activeLpBackdropEl.classList.contains("open")) {
          activeLpBackdropEl.style.display = "none";
        }
      }, 220);
    }
    document.body.classList.remove("sheet-open");
  }

  function showLpPopover(anchorEl, pt, htmlContent) {
    ensureLpOverlays();
    if (activeLpBackdropEl) activeLpBackdropEl.style.display = "block";
    if (activeLpOverlayEl) {
      activeLpOverlayEl.remove();
      activeLpOverlayEl = null;
    }
    ignoreOverlayClickUntil = Date.now() + 450;

    const pop = document.createElement("div");
    pop.className = "forge-lp-popover";
    pop.innerHTML = htmlContent;
    document.body.appendChild(pop);

    const rect = anchorEl ? anchorEl.getBoundingClientRect() : null;
    const popW = 265;
    const popH = pop.offsetHeight || 210;

    let top = pt ? pt.y - 40 : (rect ? rect.bottom + 8 : 100);
    let left = pt ? pt.x - (popW / 2) : (rect ? rect.left + (rect.width / 2) - (popW / 2) : 20);

    if (top + popH > window.innerHeight - 20) {
      top = Math.max(20, (pt ? pt.y - popH - 10 : (rect ? rect.top - popH - 8 : 20)));
    }
    left = Math.max(12, Math.min(window.innerWidth - popW - 12, left));

    pop.style.top = `${top}px`;
    pop.style.left = `${left}px`;

    activeLpOverlayEl = pop;
    activeLpBackdropEl.classList.add("open");
    requestAnimationFrame(() => pop.classList.add("open"));
  }

  function showLpSheet({ title, sub, items }) {
    ensureLpOverlays();
    if (activeLpBackdropEl) activeLpBackdropEl.style.display = "block";
    if (activeLpOverlayEl) {
      activeLpOverlayEl.remove();
      activeLpOverlayEl = null;
    }
    ignoreOverlayClickUntil = Date.now() + 450;

    const sheet = document.createElement("div");
    sheet.className = "forge-lp-sheet";

    const listHtml = items.map((it, idx) => `
      <button class="forge-lp-sheet-item ${it.danger ? 'danger' : ''} ${it.primary ? 'primary' : ''}" data-sheet-idx="${idx}">
        <div class="forge-lp-sheet-item-left">
          <div class="forge-lp-sheet-item-icon">${it.icon || '•'}</div>
          <div>
            <div>${esc(it.label)}</div>
            ${it.sub ? `<div style="font-size:11px;opacity:0.75;margin-top:2px">${esc(it.sub)}</div>` : ''}
          </div>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    `).join("");

    sheet.innerHTML = `
      <div class="forge-lp-sheet-hdr">
        <div>
          <div class="forge-lp-sheet-title">${esc(title)}</div>
          ${sub ? `<div class="forge-lp-sheet-sub">${esc(sub)}</div>` : ''}
        </div>
      </div>
      <div class="forge-lp-sheet-list">${listHtml}</div>
    `;

    sheet.onclick = (e) => {
      const btn = e.target.closest("[data-sheet-idx]");
      if (!btn) return;
      const idx = +btn.dataset.sheetIdx;
      haptic(HAPTIC.SELECT);
      items[idx]?.onClick?.();
    };

    document.body.appendChild(sheet);
    activeLpOverlayEl = sheet;
    activeLpBackdropEl.classList.add("open");
    document.body.classList.add("sheet-open");
    requestAnimationFrame(() => sheet.classList.add("open"));
  }

  function attachLongPress(el, { threshold = GESTURE.LONG_PRESS_MS, slop = GESTURE.SLOP_PX, onActivate } = {}) {
    if (!el || el._lpAttached) return;
    el._lpAttached = true;
    el.setAttribute("data-lp", "true");

    let activateTimer = null, delayTimer = null, touchId = null, sx = 0, sy = 0, activated = false, fillAnim = null;
    const PRESS_DELAY_MS = 140;

    function clear() {
      if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; }
      if (activateTimer) { clearTimeout(activateTimer); activateTimer = null; }
      touchId = null;
      activated = false;
      if (fillAnim) { fillAnim.cancel(); fillAnim = null; }
      el.classList.remove("is-pressing", "is-charging", "is-activated");
      const fill = el.querySelector(".lp-fill");
      if (fill) fill.style.transform = "scaleX(0)";
    }

    function startPress(id, x, y) {
      clear();
      touchId = id; sx = x; sy = y; activated = false;

      const remainingTime = Math.max(50, threshold - PRESS_DELAY_MS);

      delayTimer = setTimeout(() => {
        if (touchId === null) return;
        el.classList.add("is-pressing", "is-charging");

        let fill = el.querySelector(".lp-fill");
        if (!fill && (el.classList.contains("set-card-row") || el.classList.contains("ex-card-h") || el.classList.contains("hist-row") || el.classList.contains("card"))) {
          fill = document.createElement("div");
          fill.className = "lp-fill";
          el.appendChild(fill);
        }

        if (fill && fill.animate) {
          fillAnim = fill.animate(
            [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }],
            { duration: remainingTime, easing: "linear", fill: "forwards" }
          );
        }
      }, PRESS_DELAY_MS);

      activateTimer = setTimeout(() => {
        if (activated || touchId === null) return;
        activated = true;
        haptic(HAPTIC.ACTIVATE);
        el.classList.remove("is-pressing", "is-charging");
        el.classList.add("is-activated");
        setTimeout(() => el.classList.remove("is-activated"), 300);
        onActivate?.(el, { x: sx, y: sy });
      }, threshold);
    }

    el.addEventListener("touchstart", (e) => {
      if (e.target.closest("input, textarea, [contenteditable], [data-step], [data-hold], .step button, .btn-step, .icon-btn, .check, .btn-rm-set, .btn-plate-trigger")) return;
      if (el.classList.contains("set-card-row") && e.target.closest(".set-prev-tag")) return;
      if (touchId !== null) return;
      const t = e.changedTouches[0];
      startPress(t.identifier, t.clientX, t.clientY);
    }, { passive: true });

    el.addEventListener("touchmove", (e) => {
      if (touchId === null) return;
      const t = [...e.changedTouches].find(x => x.identifier === touchId);
      if (t && Math.hypot(t.clientX - sx, t.clientY - sy) > slop) clear();
    }, { passive: true });

    el.addEventListener("touchend", (e) => {
      if (touchId === null) return;
      if (activated) {
        e.preventDefault();
      }
      clear();
    }, { passive: false });

    el.addEventListener("touchcancel", clear);

    el.addEventListener("contextmenu", (e) => {
      if (e.target.closest("input, textarea, [contenteditable], [data-step], [data-hold], .step button, .btn-step, .icon-btn, .check, .btn-rm-set, .btn-plate-trigger")) return;
      if (el.classList.contains("set-card-row") && e.target.closest(".set-prev-tag")) return;
      e.preventDefault();
      if (activated) return;
      activated = true;
      onActivate?.(el, { x: e.clientX, y: e.clientY });
    });
  }

  function attachHoldConfirm(el, { duration = GESTURE.HOLD_CONFIRM_MS, onConfirm, labelDefault, labelHolding } = {}) {
    if (!el || el._holdConfirmAttached) return;
    el._holdConfirmAttached = true;
    el.classList.add("btn-hold-confirm");

    let bar = el.querySelector(".hold-confirm-bar");
    if (!bar) {
      bar = document.createElement("div");
      bar.className = "hold-confirm-bar";
      el.appendChild(bar);
    }

    let activateTimer = null, delayTimer = null, isHolding = false, touchId = null;
    const originalText = labelDefault || el.textContent;
    const PRESS_DELAY_MS = 140;

    function reset() {
      if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; }
      if (activateTimer) { clearTimeout(activateTimer); activateTimer = null; }
      isHolding = false;
      touchId = null;
      bar.style.transition = "width 0.15s ease-out";
      bar.style.width = "0%";
      if (labelHolding) el.textContent = originalText;
    }

    function startHold(id) {
      reset();
      touchId = id;
      isHolding = true;

      const remainingTime = Math.max(50, duration - PRESS_DELAY_MS);

      delayTimer = setTimeout(() => {
        if (!isHolding) return;
        bar.style.transition = `width ${remainingTime}ms linear`;
        bar.style.width = "100%";
        if (labelHolding) el.textContent = labelHolding;
      }, PRESS_DELAY_MS);

      activateTimer = setTimeout(() => {
        if (!isHolding) return;
        haptic(HAPTIC.WARNING);
        reset();
        onConfirm?.(el);
      }, duration);
    }

    el.addEventListener("touchstart", (e) => {
      if (touchId !== null) return;
      const t = e.changedTouches[0];
      startHold(t.identifier);
    }, { passive: true });

    ["touchend", "touchcancel", "touchmove"].forEach(evt => {
      el.addEventListener(evt, (e) => {
        if (evt === "touchmove" && e.touches.length > 0) {
          const rect = el.getBoundingClientRect();
          const touch = [...e.touches].find(x => x.identifier === touchId) || e.touches[0];
          if (touch.clientX < rect.left || touch.clientX > rect.right || touch.clientY < rect.top || touch.clientY > rect.bottom) {
            reset();
          }
        } else {
          reset();
        }
      }, { passive: true });
    });

    el.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      e.stopPropagation();
    });
  }

  /* ---------- Long-Press Feature Handlers ---------- */

  let setClipboard = null; // { w, r, type, rpe }

    const html = `

      <button class="forge-lp-popover-item" data-pop-act="copy-next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        <span>Copy to next set</span>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        <span>Copy set to clipboard</span>

      ${setClipboard ? `

      <button class="forge-lp-popover-item" data-pop-act="repeat-last">

        <button class="forge-set-chip ${curType==='warmup'?'active-wu':''}" data-set-type="warmup">WU</button>

        <button class="forge-set-chip ${curType==='failure'?'active-failure':''}" data-set-type="failure">FAIL</button>
      </div>
      <button class="forge-lp-popover-item" data-pop-act="clear-set">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        <span>Clear set values</span>
      </button>
      <button class="forge-lp-popover-item danger" data-pop-act="delete-set">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>
        <span>Delete set</span>

    showLpPopover(rowEl, pt, html);

    const pop = activeLpOverlayEl;

    pop.onclick = (e) => {

        const type = chip.dataset.setType;

        return;

      const item = e.target.closest("[data-pop-act]");
      if (!item) return;
      const act = item.dataset.popAct;
      haptic(HAPTIC.SELECT);

      if (act === "copy-next") copySetToNext(bid, sid);

      if (act === "clear-set") clearSetValues(bid, sid);
      if (act === "delete-set") rmSet(bid, sid);

      closeLpOverlay();

  function copySetToClipboard(bid, sid) {

  function pasteSetFromClipboard(bid, sid) {

  function showGhostTagPopover(bid, sid, tagEl, pt) {
    const { b, s } = findSet(bid, sid);
    if (!b || !s) return;
    const last = lastSessionFor(b.exerciseId, S.active.date);
    if (!last || !last.block || !last.block.sets) {
      toast("No previous session history available");
      return;
    }
    const si = b.sets.findIndex(x => x.id === sid);
    const prevSet = last.block.sets.filter(x => x.type === s.type)[si] || last.block.sets[si];
    if (!prevSet) return;

    const prevW = prevSet.w ? trimNum(toDisplay(prevSet.w)) : 0;
    const prevR = prevSet.r || 0;

    const html = `
      <div class="forge-lp-popover-hdr">
        <span>↺ Last: ${prevW} ${u()} × ${prevR}</span>
      </div>
      <button class="forge-lp-popover-item" data-ghost-act="copy-all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg>
        <span>Copy Weight & Reps (${prevW}${u()} × ${prevR})</span>
      </button>
      <button class="forge-lp-popover-item" data-ghost-act="copy-w">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/></svg>
        <span>Copy Weight Only (${prevW} ${u()})</span>
      </button>
      <button class="forge-lp-popover-item" data-ghost-act="copy-r">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>Copy Reps Only (${prevR} reps)</span>
      </button>
      <button class="forge-lp-popover-item" data-ghost-act="view-history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span>View Exercise History</span>
      </button>
    `;

    showLpPopover(tagEl, pt, html);

    const pop = activeLpOverlayEl;
    if (!pop) return;

    pop.onclick = (e) => {
      const item = e.target.closest("[data-ghost-act]");
      if (!item) return;
      const act = item.dataset.ghostAct;
      haptic(HAPTIC.SELECT);

      if (act === "copy-all") {
        s.w = prevSet.w || 0;
        s.r = prevSet.r || 0;
        save(); render();
        toast(`Copied ${prevW} ${u()} × ${prevR}`);
      } else if (act === "copy-w") {
        s.w = prevSet.w || 0;
        save(); render();
        toast(`Copied ${prevW} ${u()}`);
      } else if (act === "copy-r") {
        s.r = prevSet.r || 0;
        save(); render();
        toast(`Copied ${prevR} reps`);
      } else if (act === "view-history") {
        openExercise(b.exerciseId);
      }
      closeLpOverlay();
    };
  }

  function copySetToNext(bid, sid) {
    const { b, s } = findSet(bid, sid);
    if (!b || !s) return;
    const si = b.sets.findIndex(x => x.id === sid);
    if (si >= 0 && si + 1 < b.sets.length) {
      const nextSet = b.sets[si + 1];
      nextSet.w = s.w;
      nextSet.r = s.r;
      nextSet.type = s.type;
    } else {
      b.sets.push({
        id: uid(),
        type: s.type || "working",
        w: s.w || 0,
        r: s.r || 0,
        rpe: s.rpe || null,
        done: false
      });
    }
    save();
    render();
    haptic(HAPTIC.SUCCESS);
    toast("Copied set values to next set!");
  }

    const si = b.sets.findIndex(x => x.id === sid);

  function duplicateRoutineDay(srcIdx) {
    const src = S.routine.days[srcIdx];
    if (!src || !src.items.length) {
      toast("No items to duplicate");
      return;
    }
    let targetIdx = [1,2,3,4,5,6,0].find(i => i !== srcIdx && (!S.routine.days[i] || !S.routine.days[i].items.length));
    if (targetIdx == null) targetIdx = (srcIdx + 1) % 7;

    S.routine.days[targetIdx] = {
      name: `${src.name} (Copy)`,
      items: src.items.map(it => ({ ...it, id: uid() }))
    };
    save();
    render();
    haptic(HAPTIC.SUCCESS);
    toast(`Duplicated ${DAYS[srcIdx]} blueprint to ${DAYS[targetIdx]}`);

    const name = prompt("Enter new name for routine day:", d.name);
    if (name != null && name.trim()) {
      if (!S.routine.days[dayIdx]) S.routine.days[dayIdx] = { name: "", items: [] };
      S.routine.days[dayIdx].name = name.trim();
