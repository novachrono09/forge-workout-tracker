<style>
:root {
  --bg: #07080b;
  --bg-2: #0c0e13;
  --elev: #12151c;
  --elev-2: #171b24;
  --elev-3: #1d2230;
  --line: rgba(255,255,255,.065);
  --line-2: rgba(255,255,255,.1);
  --text: #f4f6fb;
  --muted: #8b93a7;
  --faint: #5c6478;
  --accent: #d6ff3f;
  --accent-2: #9dff57;
  --accent-ink: #12150a;
  --blue: #6ea8ff;
  --violet: #a78bfa;
  --orange: #ff8a4c;
  --red: #ff5d6c;
  --teal: #3ee0c5;
  --good: #3ee08f;
  --warn: #ffc14a;
  --shadow: 0 20px 50px rgba(0,0,0,.45);
  --radius: 18px;
  --nav-w: 248px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --font: "Outfit", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
html[data-theme="light"] {
  --bg: #f1f4f9;
  --bg-2: #e4e9f2;
  --elev: #ffffff;
  --elev-2: #f8fafc;
  --elev-3: #eef2f8;
  --line: rgba(15, 23, 42, 0.08);
  --line-2: rgba(15, 23, 42, 0.14);
  --text: #0f172a;
  --muted: #475569;
  --faint: #64748b;
  --accent: #558b00;
  --accent-ink: #ffffff;
  --shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none;
}
html, body {
  height: 100%;
  width: 100%;
  overscroll-behavior: none;
  overscroll-behavior-y: none;
}
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-font-smoothing: antialiased;
}
input, textarea {
  user-select: auto !important;
  -webkit-user-select: auto !important;
}
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
img { max-width: 100%; }
.mono { font-family: var(--mono); }
.app { display: flex; height: 100vh; height: 100dvh; max-height: 100dvh; overflow: hidden; }
.grain {
  pointer-events: none; position: fixed; inset: 0; z-index: 0; opacity: .035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Sidebar */
.sidebar {
  width: var(--nav-w); flex-shrink: 0;
  background: linear-gradient(180deg, #0c0e14 0%, #090b10 100%);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: calc(18px + var(--safe-t)) 14px calc(12px + var(--safe-b));
  z-index: 50; position: relative;
  overflow-y: auto;
  max-height: 100dvh;
  -webkit-overflow-scrolling: touch;
}
html[data-theme="light"] .sidebar { background: #fff; }
.brand { display: flex; align-items: center; gap: 12px; padding: 6px 10px 22px; flex-shrink: 0; }
.logo-mark {
  width: 40px; height: 40px; flex-shrink: 0;
  display: grid; place-items: center;
  filter: drop-shadow(0 0 14px rgba(214,255,63,.35));
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.brand:hover .logo-mark { transform: scale(1.08) rotate(2deg); }
.brand h1 { font-size: 19px; font-weight: 900; letter-spacing: -.03em; line-height: 1; display: flex; align-items: center; gap: 6px; }
.pro-badge {
  background: var(--accent); color: var(--accent-ink);
  font-size: 9.5px; font-weight: 900; letter-spacing: .08em;
  padding: 2px 6px; border-radius: 6px; text-transform: uppercase;
  box-shadow: 0 0 12px rgba(214,255,63,.4);
}
.brand small { display: block; color: var(--faint); font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.nav button {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 12px; border-radius: 12px;
  color: var(--muted); font-weight: 550; font-size: 14px; text-align: left;
  transition: .18s ease;
}
.nav button svg { width: 18px; height: 18px; opacity: .85; flex-shrink: 0; }
.nav button:hover { background: rgba(255,255,255,.04); color: var(--text); }
.nav button.active {
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 8px 22px rgba(214,255,63,.18);
}
.nav button.active svg { opacity: 1; }
.nav .sec { margin: 16px 12px 6px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.side-foot { margin-top: auto; padding: 12px 8px calc(8px + var(--safe-b)); border-top: 1px solid var(--line); flex-shrink: 0; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 10px 6px; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #2a3144, #151922);
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
  border: 1px solid var(--line-2);
}
.user-chip b { display: block; font-size: 13px; }
.user-chip span { color: var(--muted); font-size: 11px; }

/* Main */
.main {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  position: relative; z-index: 1; height: 100%; max-height: 100dvh; overflow: hidden;
  background:
    radial-gradient(1200px 500px at 80% -10%, rgba(214,255,63,.06), transparent 50%),
    radial-gradient(800px 400px at -10% 20%, rgba(110,168,255,.05), transparent 45%),
    var(--bg);
}
.topbar {
  height: calc(64px + var(--safe-t)); flex-shrink: 0; padding: var(--safe-t) 22px 0;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(16px);
}
.top-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.menu-btn { display: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--elev); }
.crumb { min-width: 0; }
.crumb h2 { font-size: 18px; font-weight: 720; letter-spacing: -.03em; }
.crumb p { color: var(--muted); font-size: 12px; margin-top: 1px; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--elev);
  display: grid; place-items: center; color: var(--text);
  transition: .15s ease;
}
.icon-btn:hover { border-color: var(--line-2); background: var(--elev-2); }
.icon-btn svg { width: 18px; height: 18px; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 22px 22px 24px; -webkit-overflow-scrolling: touch; }
.content::-webkit-scrollbar { width: 10px; }
.content::-webkit-scrollbar-thumb { background: #262b38; border-radius: 99px; }

/* ══════════ Navigation Viewport & Layers ══════════ */
#viewport {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  background: var(--bg);
}

.view-layer {
  position: absolute;
  inset: 0;
  display: none;
  background: var(--bg);
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
}
.view-layer.active { display: block; }

.view-scroll {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}

.view-dim {
  position: absolute;
  inset: 0;
  z-index: 2;
  background: #000;
  opacity: 0;
  pointer-events: none;
}

.view-layer.animating {
  will-change: transform;
  transition: transform 340ms cubic-bezier(0.32, 0.72, 0, 1);
}
.view-layer.dragging {
  will-change: transform;
}
.view-layer.animating .view-dim {
  transition: opacity 340ms cubic-bezier(0.32, 0.72, 0, 1);
}

#viewport.animating {
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

@media (prefers-reduced-motion: reduce) {
  .view-layer.animating,
  .view-layer.animating .view-dim { transition-duration: 1ms !important; }
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 14px; border-radius: 12px;
  font-weight: 650; font-size: 13.5px; letter-spacing: -.01em;
  border: 1px solid var(--line); background: var(--elev-2); color: var(--text);
  transition: .15s ease; white-space: nowrap;
}
.btn:hover { background: var(--elev-3); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; }
.btn.danger { background: rgba(255,93,108,.12); color: #ff8b96; border-color: rgba(255,93,108,.2); }
.btn.good { background: rgba(62,224,143,.12); color: var(--good); border-color: rgba(62,224,143,.2); }
.btn.wide { width: 100%; }
.btn.lg { height: 48px; padding: 0 18px; font-size: 15px; border-radius: 14px; }
.btn.sm { height: 32px; padding: 0 10px; font-size: 12px; border-radius: 9px; }
.btn:disabled { opacity: .45; pointer-events: none; }

/* Cards / layout */
.grid { display: grid; gap: 14px; }
.g-4 { grid-template-columns: repeat(4, 1fr); }
.g-3 { grid-template-columns: repeat(3, 1fr); }
.g-2 { grid-template-columns: repeat(2, 1fr); }
.card {
  background: var(--elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
.card h3 { font-size: 13px; font-weight: 650; color: var(--muted); letter-spacing: .02em; }
.stat .val { font-family: var(--mono); font-size: 28px; font-weight: 700; letter-spacing: -.04em; margin: 8px 0 2px; }
.stat .sub { color: var(--muted); font-size: 12px; }
.delta { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
.delta.up { background: rgba(62,224,143,.12); color: var(--good); }
.delta.down { background: rgba(255,93,108,.12); color: #ff8b96; }
.delta.flat { background: rgba(255,255,255,.06); color: var(--muted); }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px; border-radius: 99px;
  font-size: 11px; font-weight: 650; letter-spacing: .02em;
  background: rgba(255,255,255,.05); color: var(--muted); border: 1px solid var(--line);
}
.pill.lime { background: rgba(214,255,63,.12); color: var(--accent); border-color: rgba(214,255,63,.18); }
.pill.blue { background: rgba(110,168,255,.12); color: var(--blue); border-color: rgba(110,168,255,.18); }
.pill.orange { background: rgba(255,138,76,.12); color: var(--orange); border-color: rgba(255,138,76,.2); }
.pill.violet { background: rgba(167,139,250,.12); color: var(--violet); border-color: rgba(167,139,250,.2); }
.pill.teal { background: rgba(62,224,197,.12); color: var(--teal); border-color: rgba(62,224,197,.2); }
.pill.red { background: rgba(255,93,108,.12); color: #ff8b96; border-color: rgba(255,93,108,.2); }

.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 8px 0 12px; }
.section-head h3 { font-size: 16px; font-weight: 720; color: var(--text); letter-spacing: -.02em; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
.inp, select.inp, textarea.inp {
  width: 100%; background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 12px; padding: 11px 12px; outline: none; font-size: 14px;
  font-family: var(--font);
}
textarea.inp { resize: vertical; min-height: 80px; }
.inp:focus { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 0 0 3px rgba(214,255,63,.12); }

/* Masterclass Custom Glassmorphic Dropdown Component */
select.inp { display: none !important; }

.card:has(.forge-custom-dropdown.open),
.ex-card:has(.forge-custom-dropdown.open),
.ex-card-body-wrap:has(.forge-custom-dropdown.open),
.ex-card-b:has(.forge-custom-dropdown.open),
.modal:has(.forge-custom-dropdown.open),
.ob-card:has(.forge-custom-dropdown.open),
.field:has(.forge-custom-dropdown.open),
.row:has(.forge-custom-dropdown.open),
.grid:has(.forge-custom-dropdown.open),
.set-table:has(.forge-custom-dropdown.open),
td:has(.forge-custom-dropdown.open) {
  overflow: visible !important;
  isolation: auto !important;
  z-index: 200 !important;
}

/* Masterclass Custom Toggle Switch & Checkbox System */
input[type="checkbox"].toggle-switch {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  width: 46px;
  height: 26px;
  border-radius: 999px;
  background-color: var(--elev-2, #171b24);
  border: 1px solid var(--line-2, rgba(255,255,255,.14));
  position: relative;
  cursor: pointer;
  outline: none;
  flex-shrink: 0;
  transition: background-color 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.28s ease, box-shadow 0.28s ease;
}

input[type="checkbox"].toggle-switch::before {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background-color: #8b93a7;
  transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.28s ease, box-shadow 0.28s ease;
}

input[type="checkbox"].toggle-switch:hover {
  border-color: rgba(214, 255, 63, 0.4);
  box-shadow: 0 0 14px rgba(214, 255, 63, 0.15);
}

input[type="checkbox"].toggle-switch:checked {
  background-color: rgba(214, 255, 63, 0.22);
  border-color: rgba(214, 255, 63, 0.6);
  box-shadow: 0 0 18px rgba(214, 255, 63, 0.25);
}

input[type="checkbox"].toggle-switch:checked::before {
  transform: translateX(20px);
  background-color: var(--accent, #d6ff3f);
  box-shadow: 0 0 12px rgba(214, 255, 63, 0.85);
}

/* Universal Custom Checkbox styling for standard checkboxes */
input[type="checkbox"]:not(.toggle-switch) {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 6px;
  background-color: var(--elev-2, #171b24);
  border: 1.5px solid var(--line-2, rgba(255,255,255,.16));
  cursor: pointer;
  outline: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background-color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
}

input[type="checkbox"]:not(.toggle-switch):hover {
  border-color: rgba(214, 255, 63, 0.5);
  box-shadow: 0 0 12px rgba(214, 255, 63, 0.18);
}

input[type="checkbox"]:not(.toggle-switch):checked {
  background-color: var(--accent, #d6ff3f);
  border-color: var(--accent, #d6ff3f);
  box-shadow: 0 0 14px rgba(214, 255, 63, 0.5);
  transform: scale(1.05);
}

input[type="checkbox"]:not(.toggle-switch):checked::after {
  content: "";
  width: 5px;
  height: 9px;
  border: solid #12150a;
  border-width: 0 2.2px 2.2px 0;
  transform: rotate(45deg) translate(-0.5px, -0.5px);
}

/* FORGE Masterclass Styled Confirmation Modal */
.forge-confirm-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000 !important;
  background: rgba(8, 10, 15, 0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.22s;
}

.forge-confirm-overlay.show {
  opacity: 1;
  visibility: visible;
}

.forge-confirm-modal {
  width: 100%;
  max-width: 420px;
  background: rgba(15, 18, 26, 0.96);
  border: 1px solid rgba(255, 93, 108, 0.35);
  border-radius: 20px;
  padding: 24px 22px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(255, 93, 108, 0.18);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transform: scale(0.92) translateY(12px);
  transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.forge-confirm-overlay.show .forge-confirm-modal {
  transform: scale(1) translateY(0);
}

.forge-confirm-icon {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  margin-bottom: 14px;
  flex-shrink: 0;
}

.forge-confirm-icon.danger {
  background: rgba(255, 93, 108, 0.15);
  color: #ff8b96;
  border: 1px solid rgba(255, 93, 108, 0.3);
  box-shadow: 0 0 20px rgba(255, 93, 108, 0.2);
}

.forge-confirm-icon.lime {
  background: rgba(214, 255, 63, 0.15);
  color: #d6ff3f;
  border: 1px solid rgba(214, 255, 63, 0.3);
  box-shadow: 0 0 20px rgba(214, 255, 63, 0.2);
}

.forge-confirm-icon svg {
  width: 26px;
  height: 26px;
}

.forge-confirm-title {
  font-size: 18px;
  font-weight: 750;
  color: var(--text, #f4f6fb);
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

.forge-confirm-desc {
  font-size: 13.5px;
  color: var(--muted, #8b93a7);
  line-height: 1.5;
  margin-bottom: 20px;
}

.forge-confirm-actions {
  display: flex;
  gap: 10px;
  width: 100%;
}

.forge-confirm-actions button {
  flex: 1;
  height: 42px;
  font-weight: 650;
  font-size: 14px;
  border-radius: 12px;
}

/* Masterclass Custom Interactive Web Calendar Picker */
.forge-datepicker-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000 !important;
  background: rgba(8, 10, 15, 0.82);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.22s ease, visibility 0.22s;
}

.forge-datepicker-overlay.show {
  opacity: 1;
  visibility: visible;
}

.forge-datepicker-modal {
  width: 100%;
  max-width: 360px;
  background: rgba(15, 18, 26, 0.98);
  border: 1px solid rgba(214, 255, 63, 0.35);
  border-radius: 20px;
  padding: 20px 18px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 40px rgba(214, 255, 63, 0.2);
  display: flex;
  flex-direction: column;
  gap: 14px;
  transform: scale(0.92) translateY(10px);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.forge-datepicker-overlay.show .forge-datepicker-modal {
  transform: scale(1) translateY(0);
}

.forge-datepicker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.forge-datepicker-title {
  font-size: 16px;
  font-weight: 750;
  color: var(--text, #f4f6fb);
  letter-spacing: -0.02em;
}

.forge-datepicker-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  text-align: center;
}

.dp-day-header {
  font-size: 11px;
  font-weight: 700;
  color: var(--faint, #8b93a7);
  text-transform: uppercase;
  padding-bottom: 4px;
}

.dp-day {
  aspect-ratio: 1;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--text, #f4f6fb);
  cursor: pointer;
  background: var(--elev-2, #171b24);
  border: 1px solid var(--line-2, rgba(255,255,255,.08));
  transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.dp-day.muted {
  opacity: 0.3;
}

.dp-day:not(.muted):hover {
  border-color: rgba(214, 255, 63, 0.4);
  box-shadow: 0 0 12px rgba(214, 255, 63, 0.18);
  transform: scale(1.1);
}

.dp-day.selected {
  background: var(--accent, #d6ff3f);
  color: #12150a;
  font-weight: 800;
  border-color: var(--accent, #d6ff3f);
  box-shadow: 0 0 16px rgba(214, 255, 63, 0.6);
}

.dp-day.today:not(.selected) {
  border-color: var(--accent, #d6ff3f);
  color: var(--accent, #d6ff3f);
}

.forge-datepicker-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 6px;
  border-top: 1px solid var(--line-2, rgba(255,255,255,.08));
}

.forge-custom-dropdown {
  position: relative;
  width: 100%;
  user-select: none;
  font-family: var(--font);
  z-index: 10;
  margin: 3px 0;
  box-sizing: border-box;
}

.forge-custom-dropdown.open {
  z-index: 9999 !important;
}

.forge-dropdown-trigger {
  width: 100%;
  background: var(--elev-2, #171b24);
  border: 1px solid var(--line-2, rgba(255,255,255,.12));
  border-radius: 12px;
  padding: 11px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: var(--text, #f4f6fb);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  outline: none;
  box-sizing: border-box;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
}

.forge-dropdown-trigger:hover,
.forge-custom-dropdown.open .forge-dropdown-trigger {
  border-color: rgba(214, 255, 63, 0.45);
  box-shadow: inset 0 0 0 1px rgba(214, 255, 63, 0.25), 0 4px 14px rgba(0, 0, 0, 0.35);
  background: var(--elev-3, #1d2230);
}

.forge-dropdown-trigger:focus-visible {
  border-color: var(--accent, #d6ff3f);
  box-shadow: 0 0 0 3px rgba(214, 255, 63, 0.28);
}

.forge-dropdown-current-label {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: left;
}

.forge-dropdown-chevron {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  stroke: var(--accent, #d6ff3f);
  transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.forge-custom-dropdown.open .forge-dropdown-chevron {
  transform: rotate(180deg);
}

.forge-dropdown-popover {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  max-width: 100%;
  box-sizing: border-box;
  z-index: 9999 !important;
  background: rgba(13, 15, 21, 0.98);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(214, 255, 63, 0.45);
  border-radius: 14px;
  padding: 6px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(214, 255, 63, 0.25);
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 240px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px) scale(0.96);
  transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0.22s;
  pointer-events: none;
}

.forge-custom-dropdown.open .forge-dropdown-popover {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.forge-dropdown-item {
  padding: 10px 14px;
  border-radius: 9px;
  color: var(--text, #f4f6fb);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background-color 0.16s ease, color 0.16s ease;
}

.forge-dropdown-item:hover {
  background: rgba(214, 255, 63, 0.12);
  color: var(--accent, #d6ff3f);
}

.forge-dropdown-item.selected {
  background: rgba(214, 255, 63, 0.18);
  color: var(--accent, #d6ff3f);
  font-weight: 700;
}

.forge-dropdown-item.selected::after {
  content: "✓";
  font-size: 13px;
  font-weight: 800;
  color: var(--accent, #d6ff3f);
}
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

/* Dashboard extras */
.hero {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
  min-height: 260px;
  background:
    linear-gradient(135deg, rgba(214,255,63,.1), transparent 42%),
    var(--elev);
  padding: 28px 24px 24px;
}
.hero::after {
  content: ""; position: absolute; right: -40px; top: -50px; width: 220px; height: 220px;
  border: 28px solid rgba(214,255,63,.08); border-radius: 50%;
}
.hero-kicker { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.hero h2 { font-size: 28px; letter-spacing: -.04em; margin: 6px 0 8px; }
.hero p { color: var(--muted); max-width: 520px; font-size: 14px; }
.hero-actions { display: flex; gap: 12px; margin-top: auto; padding-top: 44px; flex-wrap: wrap; position: relative; z-index: 1; }

.heat { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; gap: 3px; }
.heat i { width: 12px; height: 12px; border-radius: 3px; background: rgba(255,255,255,.045); display: block; }
.heat i.l1 { background: rgba(214,255,63,.22); }
.heat i.l2 { background: rgba(214,255,63,.42); }
.heat i.l3 { background: rgba(214,255,63,.68); }
.heat i.l4 { background: var(--accent); }
.heat i.today { outline: 1px solid #fff; outline-offset: 1px; }

.ex-row, .hist-row, .lib-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--elev-2); cursor: pointer; transition: .15s;
}
.ex-row:hover, .hist-row:hover, .lib-row:hover { border-color: var(--line-2); background: var(--elev-3); }
.muscle-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.ex-meta { min-width: 0; flex: 1; }
.ex-meta b { display: block; font-size: 14px; letter-spacing: -.02em; }
.ex-meta span { color: var(--muted); font-size: 12px; }

/* Workout logger */
.wo-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.timer-live { font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: -.04em; }
.set-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.set-table th { text-align: left; color: var(--faint); font-weight: 650; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 0 6px 8px; }
.set-table td { padding: 6px 4px; vertical-align: middle; }
.set-num { width: 28px; height: 28px; border-radius: 8px; background: var(--elev-3); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 700; }
.set-num.wu { background: rgba(110,168,255,.12); color: var(--blue); }
.set-num.done { background: var(--accent); color: var(--accent-ink); }
.prev { color: var(--faint); font-family: var(--mono); font-size: 12px; }
.step {
  display: flex; align-items: center; background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; height: 36px;
}
.step button { width: 32px; height: 36px; color: var(--muted); font-size: 16px; }
.step button:hover { background: rgba(255,255,255,.04); color: var(--text); }
.step input {
  width: 64px; border: 0; background: transparent; text-align: center;
  font-family: var(--mono); font-weight: 600; font-size: 13px; outline: none;
}
.check {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg-2); display: grid; place-items: center; color: var(--faint);
}
.check.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.ex-card { padding: 0; overflow: hidden; }
.ex-card-h {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  cursor: pointer; user-select: none;
}
.ex-card-b { padding: 0 14px 14px; }
.pr-flash { animation: prpop .6s ease; }
@keyframes prpop { 0%{ transform: scale(.96); } 40%{ transform: scale(1.03); } 100%{ transform: scale(1); } }

/* Rest overlay */
.rest-ov {
  position: fixed; inset: 0; z-index: 50; display: none;
  background: rgba(5,6,9,.72); backdrop-filter: blur(10px);
  place-items: center; padding: 24px;
}
.rest-ov.show { display: grid; }
.rest-card { width: min(420px, 100%); text-align: center; }
.ring-wrap { width: 220px; height: 220px; margin: 0 auto 18px; position: relative; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-time {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--mono); font-size: 44px; font-weight: 700; letter-spacing: -.05em;
}

/* Modals / sheets */
.overlay {
  position: fixed; inset: 0; z-index: 4000; display: none;
  background: rgba(5,6,9,.75); backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 40px 16px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.overlay.show { display: flex; justify-content: center; align-items: flex-start; }
.modal {
  position: relative;
  width: min(580px, 100%);
  margin: auto;
  background: var(--elev); border: 1px solid var(--line);
  border-radius: 22px; padding: 22px 24px; box-shadow: var(--shadow);
  max-height: calc(100vh - 80px); max-height: calc(100dvh - 80px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain;
}
.modal > div:first-child:has(.icon-btn),
.modal > div:first-child:has(button),
.forge-datepicker-header {
  position: sticky !important;
  top: -24px !important;
  background: var(--elev) !important;
  z-index: 20 !important;
  padding-top: 16px !important;
  padding-bottom: 12px !important;
  margin-top: -16px !important;
  margin-left: -24px !important;
  margin-right: -24px !important;
  padding-left: 24px !important;
  padding-right: 24px !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
}
.modal h2 { font-size: 20px; letter-spacing: -.03em; margin-bottom: 6px; }
.modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

/* Onboarding */
.onboard {
  position: fixed; inset: 0; z-index: 60; display: none;
  background:
    radial-gradient(900px 500px at 10% 0%, rgba(214,255,63,.1), transparent 50%),
    radial-gradient(700px 400px at 100% 80%, rgba(110,168,255,.08), transparent 50%),
    var(--bg);
  overflow: auto; padding: 32px 18px;
}
.onboard.show { display: grid; place-items: center; }
.ob-card { width: min(720px, 100%); }
.split-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.split-opt {
  text-align: left; padding: 14px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--elev);
}
.split-opt.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(214,255,63,.12); }
.split-opt b { display: block; margin-bottom: 4px; }
.split-opt span { color: var(--muted); font-size: 12px; }

/* Tools / calendar / misc */
.cal {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  background: rgba(13, 15, 21, 0.5);
  border: 1px solid var(--line-2, rgba(255,255,255,.08));
  border-radius: 16px;
  padding: 12px;
}

.cal .lab {
  text-align: center;
  font-size: 11px;
  color: var(--faint, #8b93a7);
  font-weight: 750;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding-bottom: 4px;
}

.cal .d {
  aspect-ratio: 1;
  border-radius: 12px;
  background: var(--elev-2, #171b24);
  border: 1px solid var(--line-2, rgba(255,255,255,.12));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--muted, #8b93a7);
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.cal .d:hover {
  transform: translateY(-2px) scale(1.06);
  border-color: rgba(214, 255, 63, 0.4);
  box-shadow: 0 0 16px rgba(214, 255, 63, 0.18);
  color: var(--text, #f4f6fb);
}

.cal .d.done {
  background: linear-gradient(135deg, rgba(214, 255, 63, 0.22), rgba(214, 255, 63, 0.08));
  color: var(--accent, #d6ff3f);
  border-color: rgba(214, 255, 63, 0.5);
  box-shadow: 0 0 16px rgba(214, 255, 63, 0.2);
  font-weight: 700;
}

.cal .d.today {
  border-color: var(--accent, #d6ff3f);
  box-shadow: 0 0 0 2px rgba(214, 255, 63, 0.35), 0 0 18px rgba(214, 255, 63, 0.25);
}

.cal .d.today b {
  color: var(--accent, #d6ff3f);
}

/* Masterclass Custom HTML5 Date Input Picker */
input[type="date"].inp {
  color-scheme: dark;
  color: var(--text, #f4f6fb);
  font-family: var(--mono);
  font-weight: 600;
  cursor: pointer;
  position: relative;
  background-color: var(--elev-2, #171b24);
  border: 1px solid var(--line-2, rgba(255,255,255,.14));
  border-radius: 12px;
  padding: 10px 12px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input[type="date"].inp:hover {
  border-color: rgba(214, 255, 63, 0.45);
  box-shadow: 0 0 16px rgba(214, 255, 63, 0.15);
}

input[type="date"].inp:focus {
  border-color: var(--accent, #d6ff3f) !important;
  box-shadow: 0 0 0 3px rgba(214, 255, 63, 0.28) !important;
}

input[type="date"].inp::-webkit-calendar-picker-indicator {
  cursor: pointer;
  border-radius: 6px;
  padding: 4px;
  filter: invert(0.85) sepia(1) saturate(5) hue-rotate(30deg);
  transition: transform 0.2s ease, filter 0.2s ease;
}

input[type="date"].inp::-webkit-calendar-picker-indicator:hover {
  transform: scale(1.18);
  filter: invert(0.95) sepia(1) saturate(10) hue-rotate(20deg);
}

.toast-wrap { position: fixed; right: 16px; bottom: calc(18px + var(--safe-b)); z-index: 80; display: flex; flex-direction: column; gap: 8px; }
.toast {
  min-width: 240px; max-width: 360px; background: var(--elev-3); border: 1px solid var(--line-2);
  border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); font-size: 13px;
  animation: up .25s ease;
}
@keyframes up { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

.tabs { display: flex; gap: 6px; background: var(--bg-2); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
.tabs button { flex: 1; height: 32px; border-radius: 9px; font-size: 12px; font-weight: 650; color: var(--muted); }
.tabs button.on { background: var(--elev-3); color: var(--text); }

.chart {
  width: 100%;
  height: 190px;
  position: relative;
  background: rgba(13, 15, 21, 0.4);
  border: 1px solid var(--line-2, rgba(255,255,255,0.06));
  border-radius: 16px;
  padding: 12px 14px 10px;
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
}

.chart.lg {
  height: 250px;
}

.chart-node:hover circle:first-child {
  r: 10;
  opacity: 0.5;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.bar-group:hover rect {
  opacity: 1 !important;
  filter: drop-shadow(0 0 10px rgba(214, 255, 63, 0.4));
  transform: translateY(-2px);
}

.tip {
  position: fixed;
  z-index: 999;
  pointer-events: none;
  background: rgba(18, 22, 32, 0.95);
  border: 1px solid var(--accent, #d6ff3f);
  color: var(--text, #f4f6fb);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(214, 255, 63, 0.25);
  backdrop-filter: blur(10px);
  display: none;
}

/* Masterclass Floating Glassmorphic Mobile Bottom Dock & Sliding Indicator */
.bottom-nav {
  display: none;
  position: fixed;
  left: 14px;
  right: 14px;
  bottom: calc(10px + var(--safe-b));
  z-index: 800;
  background: rgba(14, 17, 24, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 20px;
  padding: 5px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 25px rgba(214, 255, 63, 0.12);
}

.bottom-nav-track {
  position: relative;
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
}

.bottom-nav-indicator {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  border-radius: 15px;
  background: linear-gradient(135deg, rgba(214, 255, 63, 0.2), rgba(214, 255, 63, 0.08));
  border: 1px solid rgba(214, 255, 63, 0.35);
  box-shadow: 0 0 16px rgba(214, 255, 63, 0.25);
  pointer-events: none;
  transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  will-change: transform, width;
}

.bottom-nav button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--faint, #8b93a7);
  font-size: 10.5px;
  font-weight: 650;
  padding: 6px 0;
  border-radius: 15px;
  position: relative;
  z-index: 2;
  transition: color 0.25s ease, opacity 0.25s ease;
  background: transparent;
  border: 0;
}

.bottom-nav button svg {
  width: 20px;
  height: 20px;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.25s ease, filter 0.25s ease;
}

.bottom-nav button.on {
  color: var(--accent, #d6ff3f);
}

.bottom-nav button.on svg {
  transform: translateY(-2px) scale(1.15);
  stroke: currentColor;
  filter: drop-shadow(0 0 8px currentColor);
}

.side-scrim { display: none; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.empty h3 { color: var(--text); margin: 8px 0 6px; }

.plate { display: inline-block; border-radius: 4px; margin: 0 2px; color: #111; font-size: 10px; font-weight: 800; padding: 10px 4px; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); }
.search input { padding-left: 36px; }

.kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; color: var(--muted); }

.prog { height: 8px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

@media (max-width: 1100px) {
  .g-4 { grid-template-columns: repeat(2, 1fr); }
  .g-3 { grid-template-columns: repeat(2, 1fr); }
  .content { padding: 20px 18px 30px !important; }
  .sidebar { padding-bottom: calc(12px + var(--safe-b)) !important; }
}
@media (max-width: 860px) {
  .sidebar {
    position: fixed; inset: 0 auto 0 0; transform: translateX(-105%);
    transition: transform .25s cubic-bezier(0.16, 1, 0.3, 1); width: min(290px, 86vw);
    height: 100%; max-height: 100dvh;
    z-index: 900 !important;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    box-shadow: 20px 0 60px rgba(0, 0, 0, 0.7);
    padding-bottom: calc(16px + var(--safe-b)) !important;
  }
  .sidebar.open { transform: none !important; }
  .side-scrim.show {
    display: block; position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 850 !important;
  }
  .menu-btn { display: grid; place-items: center; }
  .g-4, .g-3, .g-2 { grid-template-columns: 1fr; }
  .split-grid { grid-template-columns: 1fr; }
  .content { padding: 16px 14px calc(68px + var(--safe-b)) !important; }
  .bottom-nav { display: flex; z-index: 800; }

  /* Mobile Native Bottom Sheet Drawer Modals */
  .overlay.show {
    display: flex !important;
    align-items: flex-end !important;
    justify-content: center !important;
    padding: 0 !important;
    z-index: 9999 !important;
  }
  .modal {
    width: 100% !important;

/* ==========================================================================
   FORGE — Motion OS
   GPU-only properties: transform, opacity, filter
   ========================================================================== */

:root {
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-bounce: cubic-bezier(0.68, -0.6, 0.32, 1.6);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-snap: cubic-bezier(0.2, 0.8, 0.2, 1);

  --dur-instant: 90ms;
  --dur-fast: 160ms;
  --dur-med: 280ms;
  --dur-slow: 480ms;
  --dur-glide: 720ms;

  --glow-lime: 0 0 0 1px rgba(214,255,63,.28), 0 0 24px rgba(214,255,63,.22);
  --glow-lime-hot: 0 0 0 1px rgba(214,255,63,.5), 0 0 36px rgba(214,255,63,.38);
}

/* --------------------------------------------------------------------------
   Tactile surfaces
   -------------------------------------------------------------------------- */

.btn,
.icon-btn,
.check,
.nav button,
.bottom-nav button,
.split-opt,
.ex-row,
.hist-row,
.lib-row,
.pill[data-mf],
.tabs button {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transform: translateZ(0);
  transition:
    transform var(--dur-fast) var(--ease-spring),
    opacity var(--dur-fast) var(--ease-smooth),
    filter var(--dur-med) var(--ease-smooth),
    box-shadow var(--dur-med) var(--ease-smooth),
    border-color var(--dur-med) var(--ease-smooth),
    background-color var(--dur-med) var(--ease-smooth),
    color var(--dur-fast) var(--ease-smooth);
}

.btn::after,
.icon-btn::after,
.check::after,
.nav button::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(140px 80px at var(--mx, 50%) var(--my, 50%),
    rgba(214,255,63,.22), transparent 62%);
  transition: opacity var(--dur-med) var(--ease-smooth);
  z-index: 0;
}

.btn:hover::after,
.icon-btn:hover::after,
.nav button:hover::after { opacity: 1; }

.btn > *,
.icon-btn > *,
.nav button > * { position: relative; z-index: 1; }

.btn:hover,
.icon-btn:hover {
  transform: translateY(-2px) translateZ(0);
  filter: brightness(1.06);
}

.btn.primary:hover {
  box-shadow: var(--glow-lime), 0 10px 28px rgba(214,255,63,.16);
}

.btn:active,
.icon-btn:active,
.check:active,
.nav button:active,
.bottom-nav button:active,
.split-opt:active,
.ex-row:active,
.hist-row:active,
.lib-row:active {
  transform: scale(0.96) translateZ(0);
  transition-duration: var(--dur-instant);
  filter: brightness(0.96);
}

.btn:focus-visible,
.icon-btn:focus-visible,
.nav button:focus-visible,
.check:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(214,255,63,.28);
}

.card {
  transform: translateZ(0);
  transition:
    transform var(--dur-med) var(--ease-smooth),
    box-shadow var(--dur-slow) var(--ease-smooth),
    border-color var(--dur-med) var(--ease-smooth),
    filter var(--dur-med) var(--ease-smooth);
}

.card:hover {
  transform: translateY(-3px) translateZ(0);
  border-color: var(--line-2);
  box-shadow: 0 18px 40px rgba(0,0,0,.28);
}

.card.hero:hover {
  box-shadow: 0 22px 50px rgba(0,0,0,.35), 0 0 40px rgba(214,255,63,.06);
}

.ex-row:hover,
.hist-row:hover,
.lib-row:hover,
.split-opt:hover {
  transform: translateY(-2px) translateZ(0);
}

.nav button.active {
  transition: transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur-med) var(--ease-smooth);
}

.nav button.active:hover { transform: translateY(-1px) translateZ(0); }

/* Ripple */
.ripple-effect {
  position: absolute;
  width: 12px;
  height: 12px;
  margin: -6px 0 0 -6px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(214,255,63,.55) 0%, rgba(214,255,63,.12) 42%, transparent 70%);
  pointer-events: none;
  transform: scale(0);
  opacity: .9;
  animation: ripple-expand 620ms var(--ease-smooth) forwards;
  z-index: 2;
  will-change: transform, opacity;
}

.ripple-effect.ink {
  background: radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,.06) 46%, transparent 70%);
}

@keyframes ripple-expand {
  0%   { transform: scale(0); opacity: .85; }
  70%  { opacity: .35; }
  100% { transform: scale(22); opacity: 0; }
}

/* --------------------------------------------------------------------------
   View transitions + staggered entrance
   -------------------------------------------------------------------------- */

.view-enter {
  animation: view-in var(--dur-slow) var(--ease-smooth) both;
}

@keyframes view-in {
  from { opacity: 0; transform: translateY(14px) scale(.985) translateZ(0); filter: blur(6px); }
  to   { opacity: 1; transform: translateY(0) scale(1) translateZ(0); filter: blur(0); }
}

.view-exit {
  animation: view-out 180ms var(--ease-in-out) both;
}

@keyframes view-out {
  to { opacity: 0; transform: translateY(-8px) scale(.99) translateZ(0); filter: blur(4px); }
}

.stagger-in > * {
  --stagger: 0;
  animation: fadeInUp 520ms var(--ease-smooth) both;
  animation-delay: calc(var(--stagger) * 40ms);
}

.card.stagger-item,
.ex-row.stagger-item,
.hist-row.stagger-item,
.lib-row.stagger-item,
.ex-card.stagger-item {
  --stagger: 0;
  animation: fadeInUp 560ms var(--ease-smooth) both;
  animation-delay: calc(var(--stagger) * 42ms);
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px) scale(.98) translateZ(0); }
  to   { opacity: 1; transform: translateY(0) scale(1) translateZ(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* --------------------------------------------------------------------------
   Set completion + celebration
   -------------------------------------------------------------------------- */

.check {
  transition:
    transform var(--dur-fast) var(--ease-spring),
    background-color var(--dur-fast) var(--ease-smooth),
    border-color var(--dur-fast) var(--ease-smooth),
    color var(--dur-fast) var(--ease-smooth),
    box-shadow var(--dur-med) var(--ease-smooth);
}

.check.on {
  animation: check-pop 460ms var(--ease-spring) both;
  box-shadow: 0 0 0 0 rgba(214,255,63,.55), var(--glow-lime);
}

@keyframes check-pop {
  0%   { transform: scale(.72) rotate(-12deg) translateZ(0); }
  55%  { transform: scale(1.12) rotate(4deg) translateZ(0); }
  100% { transform: scale(1) rotate(0) translateZ(0); }
}

.set-num {
  transition: transform var(--dur-fast) var(--ease-spring), background-color var(--dur-med) var(--ease-smooth), color var(--dur-fast) linear;
}

.set-num.done {
  animation: set-lock 420ms var(--ease-spring) both;
}

@keyframes set-lock {
  0%   { transform: scale(.8) translateZ(0); }
  60%  { transform: scale(1.14) translateZ(0); }
  100% { transform: scale(1) translateZ(0); }
}

.set-complete-burst {
  position: absolute;
  left: var(--x, 50%);
  top: var(--y, 50%);
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  pointer-events: none;
  z-index: 30;
}

.set-complete-burst i {
  position: absolute;
  left: 0; top: 0;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px rgba(214,255,63,.8);
  transform: translate(0,0) scale(1);
  animation: spark 560ms var(--ease-out) forwards;
  animation-delay: calc(var(--i, 0) * 12ms);
  will-change: transform, opacity;
}

.set-complete-burst i:nth-child(odd) { background: #f4ffb0; width: 3px; height: 3px; }
.set-complete-burst i:nth-child(3n) { background: #9dff57; }

@keyframes spark {
  0%   { opacity: 1; transform: translate(0,0) scale(1); }
  100% {
    opacity: 0;
    transform: translate(var(--dx), var(--dy)) scale(0.15);
  }
}

.pr-flash {
  animation: pr-glow 700ms var(--ease-smooth) both;
}

@keyframes pr-glow {
  0%   { box-shadow: 0 0 0 0 rgba(214,255,63,0); filter: brightness(1); }
  35%  { box-shadow: 0 0 0 1px rgba(214,255,63,.45), 0 0 28px rgba(214,255,63,.2); filter: brightness(1.08); }
  100% { box-shadow: 0 0 0 0 rgba(214,255,63,0); filter: brightness(1); }
}

.toast {
  animation: toast-in 380ms var(--ease-spring) both;
  will-change: transform, opacity;
}

@keyframes toast-in {
  from { opacity: 0; transform: translateY(14px) scale(.96) translateZ(0); }
  to   { opacity: 1; transform: translateY(0) scale(1) translateZ(0); }
}

/* --------------------------------------------------------------------------
   Rest timer
   -------------------------------------------------------------------------- */

.rest-ov {
  transition: opacity var(--dur-med) var(--ease-smooth);
}

.rest-ov.show {
  animation: fadeIn var(--dur-med) var(--ease-smooth) both;
}

.rest-card {
  animation: modal-in 460ms var(--ease-spring) both;
}

.ring-wrap {
  position: relative;
}

.ring-wrap circle:last-of-type {
  transition: stroke-dashoffset 0.8s linear;
  will-change: stroke-dashoffset;
}

.ring-time {
  text-shadow: 0 0 24px rgba(214,255,63,.35);
}

@keyframes rest-pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.02); }
}

/* --------------------------------------------------------------------------
   Modals / overlays
   -------------------------------------------------------------------------- */

.overlay {
  opacity: 0;
  transition: opacity var(--dur-med) var(--ease-smooth);
}

.overlay.show {
  opacity: 1;
  animation: overlay-in var(--dur-med) var(--ease-smooth) both;
}

.overlay.show .modal {
  animation: modal-in 360ms var(--ease-smooth);
}

@keyframes overlay-in {
  from { opacity: 0; backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); }
  to   { opacity: 1; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
}

@keyframes modal-in {
  from { opacity: 0; transform: scale(.94) translateY(12px); filter: blur(6px); }
  to   { opacity: 1; transform: none; filter: none; }
}

.onboard.show .ob-card {
  animation: modal-in 560ms var(--ease-smooth) both;
}

/* --------------------------------------------------------------------------
   Charts, meters, heat
   -------------------------------------------------------------------------- */

.prog > i {
  transform-origin: left center;
  transition: width .8s var(--ease-smooth), transform 480ms var(--ease-smooth);
  will-change: width;
}

.chart-svg path[stroke]:not([fill="none"] + path),
.chart-svg path[fill="none"] {
  stroke-dasharray: 1200;
  stroke-dashoffset: 1200;
  animation: draw-line 1.1s var(--ease-smooth) forwards;
}

.chart-svg path[opacity=".12"],
.chart-svg path[fill]:not([fill="none"]) {
  opacity: 0;
  animation: fadeIn .7s var(--ease-smooth) .35s forwards;
}

.chart-svg circle.pt {
  transform-box: fill-box;
  transform-origin: center;
  opacity: 0;
  animation: dot-in 420ms var(--ease-spring) forwards;
  animation-delay: calc(.55s + var(--i, 0) * 40ms);
}

@keyframes draw-line {
  to { stroke-dashoffset: 0; }
}

@keyframes dot-in {
  from { opacity: 0; transform: scale(0) translateZ(0); }
  to   { opacity: 1; transform: scale(1) translateZ(0); }
}

.stat .val {
  animation: fadeInUp 500ms var(--ease-smooth) both;
}

.heat i {
  transition: transform var(--dur-fast) var(--ease-spring), filter var(--dur-med) var(--ease-smooth);
}

.heat i:hover {
  transform: scale(1.35) translateZ(0);
  filter: brightness(1.25);
}

.cal .d {
  transition: transform var(--dur-fast) var(--ease-spring), background-color var(--dur-med) var(--ease-smooth);
}

.cal .d:hover { transform: translateY(-2px) scale(1.04) translateZ(0); }

/* --------------------------------------------------------------------------
   Sidebar / chrome
   -------------------------------------------------------------------------- */

.sidebar {
  transition: transform 240ms var(--ease-smooth);
  will-change: transform;
}

.logo {
  animation: logo-idle 4.5s var(--ease-in-out) infinite;
}

@keyframes logo-idle {
  0%, 100% { box-shadow: 0 0 0 4px rgba(214,255,63,.12), 0 8px 20px rgba(214,255,63,.2); }
  50%      { box-shadow: 0 0 0 6px rgba(214,255,63,.2), 0 10px 28px rgba(214,255,63,.32); }
}

.delta.up { animation: fadeInUp 400ms var(--ease-smooth) both; }

/* Number tick */
.count-up { font-variant-numeric: tabular-nums; }

/* Live timer breathing */
.timer-live {
  animation: timer-soft 2.4s var(--ease-in-out) infinite;
}

@keyframes timer-soft {
  0%, 100% { opacity: 1; }
  50% { opacity: .72; }
}

/* Stepper press */
.step button {
  transition: transform var(--dur-instant) var(--ease-spring), background-color var(--dur-fast) linear, color var(--dur-fast) linear;
}

.step button:active { transform: scale(.88) translateZ(0); }

/* Skeleton / empty */
.empty { animation: fadeIn .4s var(--ease-smooth) both; }

/* ==========================================================================

   ========================================================================== */

/* Native Staggered Spring Reveal ONLY on Initial View Navigation */
.view-enter .card, .view-enter .ex-card, .view-enter .ex-row, .view-enter .hist-row, .view-enter .lib-row, .view-enter .stat, .view-enter .pill, .view-enter .split-opt, .view-enter .hero {

.view-enter .card:nth-child(1), .view-enter .ex-row:nth-child(1), .view-enter .hist-row:nth-child(1), .view-enter .stat:nth-child(1) { animation-delay: 0ms; }
.view-enter .card:nth-child(2), .view-enter .ex-row:nth-child(2), .view-enter .hist-row:nth-child(2), .view-enter .stat:nth-child(2) { animation-delay: 40ms; }
.view-enter .card:nth-child(3), .view-enter .ex-row:nth-child(3), .view-enter .hist-row:nth-child(3), .view-enter .stat:nth-child(3) { animation-delay: 80ms; }
.view-enter .card:nth-child(4), .view-enter .ex-row:nth-child(4), .view-enter .hist-row:nth-child(4), .view-enter .stat:nth-child(4) { animation-delay: 120ms; }
.view-enter .card:nth-child(5), .view-enter .ex-row:nth-child(5), .view-enter .hist-row:nth-child(5), .view-enter .stat:nth-child(5) { animation-delay: 160ms; }
.view-enter .card:nth-child(n+6), .view-enter .ex-row:nth-child(n+6) { animation-delay: 200ms; }

@keyframes forgeNativePop {
  0% {
    opacity: 0;
    transform: translateY(22px) scale(0.96);
  }

/* Hyper-Satisfying Liquid Elastic Accordion Engine */

/* Native Spring Hover & Press Interactions */
.btn, .icon-btn, .check, .nav button, .bottom-nav button, .pill, .split-opt {
  transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2), box-shadow 0.28s ease, filter 0.2s ease, background-color 0.2s ease;

.check.on {

  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 99980;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.forge-lp-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

/* Floating Popover Menu (Anchored to touch/element) */
.forge-lp-popover {
  position: fixed;
  z-index: 99985;
  background: #15171e;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 16px;
  padding: 8px;
  width: 265px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(214, 255, 63, 0.15);
  display: flex;
  flex-direction: column;
  gap: 4px;
  opacity: 0;
  transform: scale(0.92) translateY(4px);
  transform-origin: top center;
  transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}

.forge-lp-popover.open {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: auto;
}

.forge-lp-popover-hdr {
  padding: 6px 10px 8px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.forge-lp-popover-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: background 0.12s ease, transform 0.1s ease;
}

.forge-lp-popover-item:hover, .forge-lp-popover-item:active {
  background: rgba(255, 255, 255, 0.08);
}

.forge-lp-popover-item.danger {
  color: #ff5d6c;
}
.forge-lp-popover-item.danger:hover, .forge-lp-popover-item.danger:active {
  background: rgba(255, 93, 108, 0.14);
}

.forge-lp-popover-item svg {
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  stroke-width: 2.2;
}

/* Set-type chips row inside popover */
.forge-set-chips-row {
  display: flex;
  gap: 5px;
  padding: 4px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 10px;
  margin: 2px 0;
}

.forge-set-chip {
  flex: 1;
  padding: 6px 0;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.04);
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-align: center;
  cursor: pointer;
  transition: all 0.12s ease;
}

.forge-set-chip.active-wu {
  background: rgba(110, 168, 255, 0.2);
  border-color: #6ea8ff;
  color: #6ea8ff;
}

.forge-set-chip.active-working {
  background: rgba(214, 255, 63, 0.2);
  border-color: var(--accent);
  color: var(--accent);
}

.forge-set-chip.active-drop {
  background: rgba(167, 139, 250, 0.2);
  border-color: #a78bfa;
  color: #a78bfa;
}

.forge-set-chip.active-failure {
  background: rgba(255, 93, 108, 0.2);
  border-color: #ff5d6c;
  color: #ff5d6c;
}

/* Bottom Action Sheet */
.forge-lp-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  margin: 0 auto;
  max-width: 500px;
  max-height: 85dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  background: #14151a;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-bottom: none;
  border-radius: 24px 24px 0 0;
  z-index: 99990;
  padding: 16px 18px max(28px, calc(48px + env(safe-area-inset-bottom, 0px)));
  box-shadow: 0 -16px 50px rgba(0, 0, 0, 0.8);
  color: #fff;
  transform: translateY(105%);
  transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1);
  overscroll-behavior: contain;
}

.forge-lp-sheet.open {
  transform: translateY(0);
}

.forge-lp-sheet::before {
  content: '';
  display: block;
  width: 44px;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.22);
  margin: 0 auto 14px;
}

.forge-lp-sheet-hdr {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 14px;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.forge-lp-sheet-title {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}

.forge-lp-sheet-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.forge-lp-sheet-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.forge-lp-sheet-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: background 0.12s ease, transform 0.1s ease;
}

.forge-lp-sheet-item:hover, .forge-lp-sheet-item:active {
  background: rgba(255, 255, 255, 0.08);
  transform: scale(0.995);
}

.forge-lp-sheet-item-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.forge-lp-sheet-item-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.06);
  display: grid;
  place-items: center;
  color: var(--accent);
  flex-shrink: 0;
  font-size: 16px;
}

.forge-lp-sheet-item.danger .forge-lp-sheet-item-icon {
  background: rgba(255, 93, 108, 0.14);
  color: #ff5d6c;
}

.forge-lp-sheet-item.danger {
  color: #ff5d6c;
  border-color: rgba(255, 93, 108, 0.2);
}

.forge-lp-sheet-item.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}

.forge-lp-sheet-item.primary .forge-lp-sheet-item-icon {
  background: rgba(0, 0, 0, 0.15);
  color: var(--accent-ink);
}

/* Hold-to-confirm Destructive Buttons */
.btn-hold-confirm {
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
}

.hold-confirm-bar {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 0%;
  background: rgba(255, 93, 108, 0.45);
  pointer-events: none;
  transition: width 0.1s linear;
}

/* History Multi-select Toolbar */
.forge-multiselect-bar {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(120%);
  background: #181a22;
  border: 1px solid rgba(214, 255, 63, 0.3);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(214, 255, 63, 0.2);
  border-radius: 40px;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 99950;
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}

.forge-multiselect-bar.open {
  transform: translateX(-50%) translateY(0);
}

.hist-checkbox {
  display: none;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  place-items: center;
  margin-right: 8px;
  font-size: 14px;
  font-weight: 900;
  color: var(--accent-ink);
  background: transparent;
}

body.history-multi-mode .hist-checkbox {
  display: grid;
}

.hist-row.selected .hist-checkbox {
  background: var(--accent);
  border-color: var(--accent);
}

/* ══════════ Pull-to-Refresh Component ══════════ */
.ptr-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 0px;
  opacity: 0;
  overflow: hidden;
  pointer-events: none;
  margin-bottom: 0px;
  user-select: none;
  -webkit-user-select: none;
}
.ptr-banner.dragging {
  transition: none;
}
.ptr-banner.releasing {
  transition: height 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease, margin-bottom 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.ptr-banner.refreshing {
  height: 54px;
  opacity: 1;
  margin-bottom: 12px;
  transition: height 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, margin-bottom 0.3s ease;
}

.ptr-pill {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 7px 15px;
  border-radius: 999px;
  background: var(--elev-2);
  border: 1px solid var(--line);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 0px rgba(214, 255, 63, 0);
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 650;
  letter-spacing: 0.01em;
  transform: scale(0.85);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s ease;
}

.ptr-banner.armed .ptr-pill {
  color: var(--accent);
  border-color: rgba(214, 255, 63, 0.45);
  background: rgba(214, 255, 63, 0.08);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 16px rgba(214, 255, 63, 0.25);
  transform: scale(1.02);
}

.ptr-banner.refreshing .ptr-pill {
  color: var(--accent);
  border-color: rgba(214, 255, 63, 0.5);
  background: rgba(214, 255, 63, 0.1);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 20px rgba(214, 255, 63, 0.3);
  transform: scale(1);
}

.ptr-banner.done .ptr-pill {
  color: var(--good);
  border-color: rgba(62, 224, 143, 0.5);
  background: rgba(62, 224, 143, 0.1);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), 0 0 16px rgba(62, 224, 143, 0.25);
}

.ptr-icon-wrap {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.ptr-icon {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ptr-banner.refreshing .ptr-icon-wrap {
  animation: ptr-spin 0.75s linear infinite;
}

@keyframes ptr-spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ══════════ Compositor-Driven Kinetic Strike Boot Animation ══════════ */
:root {
  --volt: #D6FF3F;
  --volt-hi: #EDFFB3;
  --ink: #FFFFFF;
  --dim: #93A084;
  --boot-bg: #060905;

  /* timeline anchors */
  --t-fly: 60ms;
  --t-impact: 400ms;
  --t-strike: 560ms;
  --t-word: 860ms;
  --t-exit: 2100ms;
}

#boot {
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: var(--boot-bg);
  contain: layout style;
  pointer-events: none;
}
#boot.boot--done { opacity: 0; transition: opacity .18s linear; }

.scene {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(16px, 4vw, 26px);
  padding-bottom: 5vh;
  transform-origin: 50% 44%;
  will-change: transform, opacity;
  backface-visibility: hidden;
  animation: scene-exit 700ms var(--t-exit) cubic-bezier(.65, .05, .9, .4) both;
}

@keyframes scene-exit {
  0%   { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.62); opacity: 0; }
}

.shake {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(16px, 4vw, 26px);
  will-change: transform;
  backface-visibility: hidden;
  animation: shake 380ms var(--t-impact) both,
             shake2 220ms 780ms cubic-bezier(.2, .7, .3, 1) forwards;
}

@keyframes shake {
  0%   { transform: translate3d(0, 0, 0); }
  14%  { transform: translate3d(-11px, 5px, 0); }
  28%  { transform: translate3d(9px, -5px, 0); }
  42%  { transform: translate3d(-7px, 3px, 0); }
  56%  { transform: translate3d(5px, -3px, 0); }
  70%  { transform: translate3d(-3px, 2px, 0); }
  84%  { transform: translate3d(2px, -1px, 0); }
  100% { transform: translate3d(0, 0, 0); }
}

@keyframes shake2 {
  0%   { transform: translate3d(-4px, 2px, 0); }
  30%  { transform: translate3d(4px, -2px, 0); }
  60%  { transform: translate3d(-2px, 1px, 0); }
  100% { transform: translate3d(0, 0, 0); }
}

.zone {
  position: relative;
  width: clamp(160px, 48vw, 240px);
  aspect-ratio: 1;
  flex: none;
}

.half {
  position: absolute;
  inset: 0;
  transform-origin: 50% 50%;
  will-change: transform;
  backface-visibility: hidden;
}
.half svg, .tri-wrap svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.half--l {
  animation: slam-l 340ms var(--t-fly) both,
            squash 340ms var(--t-impact) cubic-bezier(.3, 1.5, .45, 1) forwards,
            half-exit-l 700ms var(--t-exit) cubic-bezier(.6, .05, .9, .4) forwards;
}
.half--r {
  animation: slam-r 340ms var(--t-fly) both,
            squash 340ms var(--t-impact) cubic-bezier(.3, 1.5, .45, 1) forwards,
            half-exit-r 700ms var(--t-exit) cubic-bezier(.6, .05, .9, .4) forwards;
}

.tri-wrap {
  position: absolute;
  inset: 0;
  will-change: transform, opacity;
  backface-visibility: hidden;
  animation: tri-ignite 480ms var(--t-impact) cubic-bezier(.16, 1, .3, 1) both;
}

@keyframes tri-ignite {
  0%   { opacity: 0; transform: scale(0.15) translate3d(0, -8px, 0); }
  32%  { opacity: 1; transform: scale(1.35) translate3d(0, 0, 0); }
  48%  { transform: scale(1) translate3d(0, 0, 0); opacity: 1; }
  100% { opacity: 1; transform: scale(1) translate3d(0, 0, 0); }
}

@keyframes slam-l {
  0%   { transform: translate3d(-120vw, 0, 0) skewX(-16deg); animation-timing-function: cubic-bezier(.62, .02, .9, .42); }
  100% { transform: translate3d(0, 0, 0) skewX(0deg); }
}
@keyframes slam-r {
  0%   { transform: translate3d(120vw, 0, 0) skewX(16deg); animation-timing-function: cubic-bezier(.62, .02, .9, .42); }
  100% { transform: translate3d(0, 0, 0) skewX(0deg); }
}
@keyframes squash {
  0%   { transform: scale(.9, 1.1); }
  100% { transform: scale(1, 1); }
}
@keyframes half-exit-l {
  0%   { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(-52%, 0, 0); }
}
@keyframes half-exit-r {
  0%   { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(52%, 0, 0); }
}

.tail {
  position: absolute;
  top: 28%;
  bottom: 32%;
  width: 46vw;
  opacity: 0;
  will-change: opacity;
}
.half--l .tail {
  right: 48%;
  background: linear-gradient(90deg, transparent, rgba(214, 255, 63, .5));
  animation: tail 360ms var(--t-fly) both;
}
.half--r .tail {
  left: 48%;
  background: linear-gradient(270deg, transparent, rgba(214, 255, 63, .5));
  animation: tail 360ms var(--t-fly) both;
}
@keyframes tail {
  0%   { opacity: .95; }
  80%  { opacity: .95; }
  100% { opacity: 0; }
}

.aura {
  position: absolute;
  inset: -30% -36%;
  border-radius: 50%;
  opacity: 0;
  background: radial-gradient(closest-side, rgba(214, 255, 63, .32), rgba(214, 255, 63, .10) 45%, transparent 72%);
  will-change: transform, opacity;
  animation: aura 650ms var(--t-impact) cubic-bezier(.2, .8, .3, 1) both;
}
@keyframes aura {
  0%   { transform: scale(.55); opacity: 0; }
  30%  { opacity: .9; }
  100% { transform: scale(1); opacity: .55; }
}

.burst {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(72vw, 340px);
  aspect-ratio: 1;
  border-radius: 50%;
  opacity: 0;
  will-change: transform, opacity;
  background: radial-gradient(closest-side, #FBFFDD 0%, var(--volt) 26%, rgba(214, 255, 63, .28) 55%, transparent 74%);
  animation: burst 520ms var(--t-impact) cubic-bezier(.16, .84, .44, 1) both;
}
@keyframes burst {
  0%   { transform: translate(-50%, -50%) scale(.12); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1.55); opacity: 0; }
}

.ring {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(60vw, 280px);
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2.5px solid var(--volt);
  opacity: 0;
  will-change: transform, opacity;
}
.ring--1 { --s: 2.3; animation: ring 620ms var(--t-impact) cubic-bezier(.17, .9, .3, 1) both; }
.ring--2 { --s: 2.8; border-width: 2px; animation: ring 760ms 428ms cubic-bezier(.17, .9, .3, 1) both; }
.ring--3 { --s: 3.3; border-width: 1.5px; animation: ring 900ms 462ms cubic-bezier(.17, .9, .3, 1) both; }

@keyframes ring {
  0%   { transform: translate(-50%, -50%) scale(.14) scaleY(.55); opacity: .95; }
  100% { transform: translate(-50%, -50%) scale(var(--s)) scaleY(.55); opacity: 0; }
}

.streak {
  position: absolute;
  top: calc(50% + var(--y));
  left: 50%;
  width: var(--w);
  height: var(--h, 2px);
  margin-left: calc(var(--w) / -2);
  opacity: 0;
  will-change: transform, opacity;
  background: linear-gradient(90deg, transparent, rgba(214, 255, 63, .95), transparent);
  animation: streak var(--d) var(--dl) cubic-bezier(.12, .75, .25, 1) both;
}
@keyframes streak {
  0%   { transform: translate3d(calc(var(--dir) * -6vw), 0, 0) scaleX(.25); opacity: 0; }
  12%  { opacity: 1; }
  100% { transform: translate3d(calc(var(--dir) * 54vw), 0, 0) scaleX(1.3); opacity: 0; }
}

.slash {
  position: absolute;
  left: -14%;
  top: 56%;
  width: 128%;
  height: clamp(8px, 2.6vw, 12px);
  background: var(--volt);
  clip-path: polygon(2.5% 0, 100% 0, 97.5% 100%, 0 100%);
  will-change: transform;
  animation: strike 240ms var(--t-strike) both;
}
@keyframes strike {
  0%   { transform: translate3d(-110vw, 0, 0); animation-timing-function: cubic-bezier(.06, .6, .12, 1); }
  78%  { transform: translate3d(1.8%, 0, 0); animation-timing-function: cubic-bezier(.3, .7, .4, 1); }
  100% { transform: translate3d(0, 0, 0); }
}
.slash .tail--s {
  position: absolute;
  right: 100%;
  top: 15%;
  bottom: 15%;
  width: 34vw;
  background: linear-gradient(90deg, transparent, rgba(214, 255, 63, .6));
  opacity: 0;
  will-change: opacity;
  animation: s-tail 400ms var(--t-strike) both;
}
@keyframes s-tail {
  0%   { opacity: .9; }
  62%  { opacity: .9; }
  100% { opacity: 0; }
}

.scanline {
  position: absolute;
  top: calc(56% + clamp(8px, 2.6vw, 12px) / 2);
  left: 50%;
  width: 94vw;
  height: 3px;
  margin-left: -47vw;
  opacity: 0;
  will-change: transform, opacity;
  background: linear-gradient(90deg, transparent, var(--volt-hi) 18% 82%, transparent);
  animation: scan 240ms 760ms cubic-bezier(.2, .8, .3, 1) both;
}
@keyframes scan {
  0%   { transform: scaleX(.25); opacity: 1; }
  100% { transform: scaleX(1); opacity: 0; }
}

.ghost {
  position: absolute;
  left: -15%;
  right: -15%;
  top: 0;
  bottom: 0;
  opacity: 0;
  will-change: opacity;
  pointer-events: none;
  animation: ghost 700ms var(--t-exit) linear both;
}
.ghost svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
@keyframes ghost {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}

.word {
  display: flex;
  gap: .02em;
  color: var(--ink);
  font-size: clamp(44px, 14vw, 76px);
  line-height: .94;
  font-weight: 900;
  letter-spacing: 0.2em;
  text-indent: 0.2em;
}
.word b {
  display: inline-block;
  will-change: transform, opacity;
  animation: punch 210ms calc(var(--t-word) + var(--i) * 70ms) cubic-bezier(.16, 1, .3, 1) both;
}
@keyframes punch {
  0%   { transform: translate3d(0, .4em, 0) scale(1.9) skewX(-12deg); opacity: 0; }
  40%  { opacity: 1; }
  100% { transform: translate3d(0, 0, 0) scale(1) skewX(0deg); opacity: 1; }
}

  7%   { opacity: 1; }

  100% { opacity: .08; }

  const KEY = "forge.v1";
  const defaultState = () => ({
    version: 1,
    onboarded: false,
    profile: { name:"", unit:"kg", goal:"Build strength", theme:"dark", weekStarts:1, showRpe:true, autoRest:true, increment:2.5, defaultRest:90, bar:20 },
    routine: { template:"ppl3", days: {} },
    customEx: [],
    workouts: [],
    active: null,
    body: [],

    notes: [],
    prefs: { hideCompletedLib:false }
  });

  let S = defaultState();
  let view = "dashboard";
  let rest = { on:false, left:0, total:90, t:null, after:null };
  let tick = null;
  let wakeLock = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) S = Object.assign(defaultState(), JSON.parse(raw));
    } catch(e) { S = defaultState(); }
    document.documentElement.dataset.theme = S.profile.theme || "dark";
  }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(S));
  }

  const allEx = () => [...LIB, ...S.customEx];
  const getEx = (id) => allEx().find(e => e.id === id) || {id, name:id, muscle:"full", muscles:["full"], equipment:"other", cues:""};
  const unit = () => S.profile.unit || "kg";
  const inc = () => Number(S.profile.increment) || (unit()==="kg" ? 2.5 : 5);
  function toDisplay(kg) {
    if (unit()==="lbs") return Math.round(kg * 2.2046226218 * 2) / 2;
    return Math.round(kg * 4) / 4;
  }
  function toKg(v) { return unit()==="lbs" ? Number(v)/2.2046226218 : Number(v); }
  function wlab(kg, d=unit()==="kg"?1:0) {
    if (kg==null || kg==="" || isNaN(kg)) return "—";
    const n = toDisplay(kg);
    return `${trimNum(n)}${d!==false?"":""}`;
  }
  const u = () => unit();
  const trimNum = (n) => {
    if (n==null || isNaN(n)) return "—";
    const x = Math.round(Number(n)*100)/100;
    return Number.isInteger(x) ? String(x) : String(x);
  };
  const e1rm = (w, r) => {
    w = Number(w); r = Number(r);
    if (!w || !r) return 0;
    if (r === 1) return w;
    if (r > 15) return w * (1 + 15/30);
    return w * (1 + r/30);
  };
  const volumeOf = (wo) => (wo.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done && s.type!=="warmup").reduce((b,s)=>b+(Number(s.w)||0)*(Number(s.r)||0),0),0);
  const workingSets = (wo) => (wo.exercises||[]).reduce((a,ex)=>a+ex.sets.filter(s=>s.done && s.type!=="warmup").length,0);

  function applyTemplate(key) {
    const t = TEMPLATES[key] || TEMPLATES.custom;
    const days = {};
    for (let i=0;i<7;i++) {
      const src = t.days[i] || {name:"Rest", items:[]};
      days[i] = {
        name: src.name,
        items: (src.items||[]).map(([exerciseId, sets, reps, rest]) => ({
          id: uid(), exerciseId, sets, reps, rest, note:""
        }))
      };
    }
    S.routine = { template:key, days };
  }

  function plannedToday() {
    const d = new Date().getDay();
    return S.routine.days[d] || {name:"Rest", items:[]};
  }
  function workoutsOn(iso) { return S.workouts.filter(w => w.date===iso && w.status==="done"); }
  function lastSessionFor(exId, beforeIso) {
    const list = S.workouts.filter(w => w.status==="done" && (!beforeIso || w.date < beforeIso) && w.exercises.some(e => e.exerciseId===exId));
    list.sort((a,b)=> b.date.localeCompare(a.date) || (b.ended||"").localeCompare(a.ended||""));
    if (!list.length) return null;
    const w = list[0];
    return { workout:w, block: w.exercises.find(e=>e.exerciseId===exId) };
  }
  function prsFor(exId) {
    let bestW=0, bestE=0, bestRepsAtW={w:0,r:0}, vol=0;
    for (const w of S.workouts.filter(x=>x.status==="done")) {
      const b = w.exercises.find(e=>e.exerciseId===exId);
      if (!b) continue;
      let v=0;
      for (const s of b.sets.filter(s=>s.done && s.type!=="warmup")) {
        const ww=Number(s.w)||0, rr=Number(s.r)||0;
        if (ww>bestW) bestW=ww;
        const e=e1rm(ww,rr); if (e>bestE) bestE=e;
        if (ww>bestRepsAtW.w || (ww===bestRepsAtW.w && rr>bestRepsAtW.r)) bestRepsAtW={w:ww,r:rr};
        v+=ww*rr;
      }
      if (v>vol) vol=v;
    }
    return { bestW, bestE, bestRepsAtW, vol };
  }
  function detectPRs(wo) {
    const hits = [];
    for (const block of wo.exercises) {
      const prev = prsIgnoring(block.exerciseId, wo.id);
      for (const s of block.sets.filter(s=>s.done && s.type!=="warmup")) {
        const w=Number(s.w)||0, r=Number(s.r)||0;
        if (w>0 && w > (prev.bestW||0) + 1e-6) hits.push({type:"Load PR", ex:getEx(block.exerciseId).name, detail:`${trimNum(toDisplay(w))} ${u()} × ${r}`});
        if (e1rm(w,r) > (prev.bestE||0) + 0.5) hits.push({type:"e1RM PR", ex:getEx(block.exerciseId).name, detail:`${trimNum(toDisplay(e1rm(w,r)))} ${u()} est.`});
      }
    }
    const uniq = [];
    const seen = new Set();
    for (const h of hits) { const k=h.type+h.ex; if(!seen.has(k)){seen.add(k); uniq.push(h);} }
    return uniq;
  }
  function prsIgnoring(exId, woId) {
    let bestW=0, bestE=0;
    for (const w of S.workouts.filter(x=>x.status==="done" && x.id!==woId)) {
      const b = w.exercises.find(e=>e.exerciseId===exId);
      if (!b) continue;
      for (const s of b.sets.filter(s=>s.done && s.type!=="warmup")) {
        const ww=Number(s.w)||0, rr=Number(s.r)||0;
        if (ww>bestW) bestW=ww;
        const e=e1rm(ww,rr); if (e>bestE) bestE=e;
      }
    }
    return {bestW,bestE};
  }

  function streak() {
    const days = new Set(S.workouts.filter(w=>w.status==="done").map(w=>w.date));
    let n=0; const d=new Date();
    if (!days.has(todayISO(d))) d.setDate(d.getDate()-1);
    while (days.has(todayISO(d))) { n++; d.setDate(d.getDate()-1); }
    return n;
  }
  function weekVolume(offset=0) {
    const now = new Date(); now.setDate(now.getDate() - offset*7);
    const ws = S.profile.weekStarts ?? 1;
    const day = (now.getDay() - ws + 7) % 7;
    const start = new Date(now); start.setDate(now.getDate()-day);
    const end = new Date(start); end.setDate(start.getDate()+7);
    const a = todayISO(start), b = todayISO(end);
    return S.workouts.filter(w=>w.status==="done" && w.date>=a && w.date<b).reduce((s,w)=>s+volumeOf(w),0);
  }
  function sessionsThisWeek() {
    const now = new Date();
    const ws = S.profile.weekStarts ?? 1;
    const day = (now.getDay() - ws + 7) % 7;
    const start = new Date(now); start.setDate(now.getDate()-day);
    const a = todayISO(start);
    return S.workouts.filter(w=>w.status==="done" && w.date>=a).length;
  }

  function toast(msg, extra="") {
